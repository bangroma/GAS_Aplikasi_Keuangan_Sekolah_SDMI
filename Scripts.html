<script>
  let selectedSiswa = null;
  let listTagihanSiswa = [];
  let detailTransaksiAktif = null;
  let isFilterPosLoaded = false;
  let isFilterPosLunasLoaded = false;
  let currentModalTunggakanKelas = null;
  let currentModalTunggakanPos = "ALL";
  let currentModalTunggakanData = [];
  let currentDetailSiswaMenunggak = null;
  let currentModalLunasKelas = null;
  let currentModalLunasPos = "ALL";
  let currentModalLunasData = [];


  /* ========================================================
   UTILITIES
======================================================== */

  function formatRupiah(number) {
    return new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0,
    }).format(Number(number) || 0);
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .split("&")
      .join("&amp;")
      .split("<")
      .join("&lt;")
      .split(">")
      .join("&gt;")
      .split('"')
      .join("&quot;")
      .split("'")
      .join("&#039;");
  }

  function getLabelMetodePembayaran(metode) {
    const map = {
      TUNAI: "TUNAI",
      CASH: "TUNAI",
      TRANSFER_BCA: "TRANSFER BCA",
      TRANSFER_BRI: "TRANSFER BRI",
      TRANSFER_Bank: "TRANSFER Bank Lain",
      QRIS: "QRIS",
    };

    return map[metode] || metode || "-";
  }

  function showNotification(message, icon) {
    return Swal.fire({
      title:
        icon === "success"
          ? "Berhasil"
          : icon === "error"
            ? "Gagal"
            : "Informasi",
      text: String(message ?? ""),
      icon: icon || "info",
      confirmButtonText: "OK",
      confirmButtonColor: "#059669",
    });
  }

  function showConfirmation(message) {
    return Swal.fire({
      title: "Konfirmasi",
      text: String(message ?? ""),
      icon: "warning",
      showCancelButton: true,
      confirmButtonText: "Ya, lanjutkan",
      cancelButtonText: "Batal",
      confirmButtonColor: "#059669",
      cancelButtonColor: "#64748b",
      reverseButtons: true,
    }).then(function (result) {
      return result.isConfirmed;
    });
  }

  // Menjamin seluruh notifikasi lama menggunakan SweetAlert2.
  window.alert = function (message) {
    return showNotification(message, "info");
  };

  /* ========================================================
   TAB
======================================================== */

  function switchTab(tabName) {
    document
      .querySelectorAll(".tab-content")
      .forEach((el) => el.classList.add("hidden"));

    document.querySelectorAll(".nav-btn").forEach((el) => {
      el.classList.remove("bg-emerald-600", "text-white", "font-semibold");
      el.classList.add("hover:bg-slate-700", "text-slate-300");
    });

    const view = document.getElementById("view-" + tabName);
    if (view) {
      view.classList.remove("hidden");
    }

    const nav = document.getElementById("nav-" + tabName);
    if (nav) {
      nav.classList.add("bg-emerald-600", "text-white", "font-semibold");
      nav.classList.remove("hover:bg-slate-700", "text-slate-300");
    }

    if (tabName === "riwayat") {
      loadRiwayatTransaksiJS();
    }

    if (tabName === "laporan") {
      loadOptionsFilterPos();
      loadRekapLaporanJS();
    }

    if (tabName === "laporan-lunas") {
      loadOptionsFilterPosLunasJS();
      loadRekapLaporanLunasJS();
    }

    // TAB BARU
    if (tabName === "setting-tagihan") {
      loadOptionsSettingTagihan();
      loadRiwayatSettingTagihanJS(1);
      switchRiwayatSettingTab("kelas");
    }
    if (tabName === "siswa") {
      loadSiswaJS();
    }

    if (tabName === "master") {
      switchMasterTab(currentMasterSheet || "Master_Pos");
    }
  }
  /* ========================================================
   CARI SISWA
======================================================== */

  function handleSearchKeyup(e) {
    if (e.key === "Enter") {
      cariSiswaJS();
    }
  }

  function cariSiswaJS() {
    const kw = document.getElementById("input-search").value.trim();
    const dropdown = document.getElementById("search-dropdown");

    if (!kw) {
      dropdown.classList.add("hidden");
      return;
    }

    dropdown.innerHTML = `
    <div class="p-4 text-center text-xs text-slate-500">
      <i class="fa-solid fa-spinner animate-spin mr-1"></i>
      Mencari siswa...
    </div>
  `;

    dropdown.classList.remove("hidden");

    google.script.run
      .withSuccessHandler(function (results) {
        if (!results || !results.length) {
          dropdown.innerHTML = `
          <div class="p-4 text-center text-xs text-slate-500">
            Siswa tidak ditemukan.
          </div>
        `;

          return;
        }

        let html = "";

        results.forEach(function (s) {
          html += `
          <button
            type="button"
            onclick='selectSiswaJS(${JSON.stringify({
              id_siswa: s.id_siswa,
              nama: s.nama_lengkap || "",
              nisn: s.nisn || s.nis || "",
              nis: s.nis || "",
              kelas: s.kelas || "",
              namaPotongan: s.nama_potongan || "",
            })})'
            class="w-full text-left p-3 hover:bg-emerald-50 cursor-pointer transition">

            <div class="font-bold text-slate-800 text-sm">
              ${escapeHtml(s.nama_lengkap || "-")}
            </div>

            <div class="text-xs text-slate-500">
              NISN: ${escapeHtml(s.nisn || "-")}
              |
              NIS: ${escapeHtml(s.nis || "-")}
              |
              Kelas: ${escapeHtml(s.kelas || "-")}
            </div>

          </button>
        `;
        });

        dropdown.innerHTML = html;
      })
      .withFailureHandler(function (err) {
        dropdown.innerHTML = `
        <div class="p-4 text-center text-xs text-rose-500">
          Gagal mencari siswa: ${escapeHtml(err.message)}
        </div>
      `;
      })
      .cariSiswa(kw);
  }

  /* ========================================================
   PILIH SISWA
======================================================== */

  function selectSiswaJS(data) {
    selectedSiswa = {
      id: data.id_siswa,
      id_siswa: data.id_siswa,
      nama: data.nama,
      nisn: data.nisn,
      nis: data.nis,
      kelas: data.kelas,
      namaPotongan: data.namaPotongan,
    };

    document.getElementById("search-dropdown").classList.add("hidden");

    document.getElementById("input-search").value = data.nama;

    document.getElementById("info-nama").innerText = data.nama || "-";

    document.getElementById("info-nisn").innerText =
      `NISN: ${data.nisn || "-"} | NIS: ${data.nis || "-"}`;

    document.getElementById("info-kelas").innerText =
      `Kelas ${data.kelas || "-"}`;

    document.getElementById("info-potongan").innerText =
      data.namaPotongan || "Tidak Ada";

    document.getElementById("student-empty-box").classList.add("hidden");

    document.getElementById("student-info-box").classList.remove("hidden");

    loadTagihanSiswaJS(data.id_siswa);
  }

  /* ========================================================
   LOAD TAGIHAN
======================================================== */

  function loadTagihanSiswaJS(idSiswa) {
    const container = document.getElementById("tagihan-container");

    container.innerHTML = `
    <div class="flex flex-col items-center justify-center h-48 text-slate-500">
      <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-2 text-emerald-600"></i>
      <p class="text-xs font-semibold">
        Mengambil daftar tagihan siswa...
      </p>
    </div>
  `;

    google.script.run
      .withSuccessHandler(function (data) {
        listTagihanSiswa = Array.isArray(data) ? data : [];

        renderTagihanListJS(listTagihanSiswa);
      })
      .withFailureHandler(function (err) {
        container.innerHTML = `
        <div class="p-4 bg-rose-50 text-rose-700 rounded-lg text-sm">
          Gagal memuat tagihan:
          ${escapeHtml(err.message)}
        </div>
      `;
      })
      .getTagihanSiswa(idSiswa);
  }

  /* ========================================================
   RENDER TAGIHAN
======================================================== */

  function renderTagihanListJS(list) {
    const container = document.getElementById("tagihan-container");

    document.getElementById("tagihan-count").innerText =
      `${list.length} Item Tagihan`;

    if (!list.length) {
      container.innerHTML = `
      <div class="flex flex-col items-center justify-center h-48 text-emerald-600 bg-emerald-50 rounded-xl border border-emerald-200">

        <i class="fa-solid fa-circle-check text-4xl mb-2"></i>

        <p class="text-sm font-bold">
          Semua Tagihan Siswa Ini Telah Lunas!
        </p>

      </div>
    `;

      document.getElementById("payment-options").classList.add("hidden");

      document.getElementById("checkout-box").classList.add("hidden");

      return;
    }

    let html = "";

    list.forEach(function (t, index) {
      const sisa = Number(t.sisa_tunggakan) || 0;
      const bisaDicicil =
        t.bisa_dicicil === true ||
        String(t.bisa_dicicil).toLowerCase() === "true" ||
        String(t.bisa_dicicil) === "1";

      html += `

      <div
        class="p-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-white transition space-y-3">

        <div class="flex items-start justify-between gap-3">

          <div class="flex items-start gap-3">

            <input
              type="checkbox"
              id="chk-${index}"
              onchange="recalculateTotalJS()"
              class="mt-1 w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer">

            <div>

              <label
                for="chk-${index}"
                class="font-bold text-slate-800 cursor-pointer hover:text-emerald-700 block">

                ${escapeHtml(t.nama_pos || t.nama_item_snapshot || "Tagihan")}

                ${
                  t.periode
                    ? ` <span class="text-slate-500 font-medium">(${escapeHtml(t.periode)})</span>`
                    : ""
                }

              </label>

              <div class="text-xs text-slate-500 mt-1">
                Tagihan:
                ${formatRupiah(t.nominal_akhir)}
                |
                Terbayar:
                ${formatRupiah(t.terbayar)}
              </div>

              <div class="mt-1">

                ${
                  bisaDicicil
                    ? `
                    <span class="inline-flex px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-[10px] font-bold">
                      BISA DICICIL
                    </span>
                  `
                    : `
                    <span class="inline-flex px-2 py-0.5 rounded-full bg-slate-200 text-slate-600 text-[10px] font-bold">
                      TIDAK DICICIL
                    </span>
                  `
                }

              </div>

            </div>

          </div>


          <div class="text-right">

            <span class="text-xs text-rose-600 font-semibold block">
              Sisa Tunggakan
            </span>

            <span class="font-bold text-slate-800">
              ${formatRupiah(sisa)}
            </span>

          </div>

        </div>


        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 border-t border-slate-200/80">

          <div>

            <label class="text-[11px] font-semibold text-slate-600 block">
              Nominal Dibayar
            </label>

            <input
              type="number"
              id="input-bayar-${index}"
              oninput="recalculateTotalJS()"
              value="${sisa}"
              min="0"
              max="${sisa}"
              class="w-full mt-0.5 p-2 border rounded-lg text-sm font-bold text-emerald-700 outline-none focus:ring-2 focus:ring-emerald-500 bg-white">

          </div>


          <div>

            <label class="text-[11px] font-semibold text-slate-600 block">
              Diskon Tambahan
            </label>

            <input
              type="number"
              id="input-diskon-${index}"
              value="0"
              min="0"
              oninput="recalculateTotalJS()"
              class="w-full mt-0.5 p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-white">

          </div>

        </div>

      </div>

    `;
    });

    container.innerHTML = html;

    document.getElementById("payment-options").classList.remove("hidden");

    document.getElementById("checkout-box").classList.remove("hidden");

    recalculateTotalJS();
  }

  /* ========================================================
   HITUNG TOTAL
======================================================== */

  function recalculateTotalJS() {
    let grandTotal = 0;
    let countChecked = 0;

    listTagihanSiswa.forEach(function (t, index) {
      const chk = document.getElementById(`chk-${index}`);

      if (chk && chk.checked) {
        countChecked++;

        const nominal =
          Number(document.getElementById(`input-bayar-${index}`).value) || 0;

        grandTotal += nominal;
      }
    });

    document.getElementById("summary-items-count").innerText =
      `${countChecked} Item`;

    document.getElementById("summary-total-bayar").innerText =
      formatRupiah(grandTotal);

    const btn = document.getElementById("btn-submit-bayar");

    btn.disabled = !(countChecked > 0 && grandTotal > 0);
  }

  /* ========================================================
   SIMPAN TRANSAKSI
======================================================== */

  function prosesBayarJS() {
    if (!selectedSiswa) {
      alert("Silakan pilih siswa terlebih dahulu.");
      return;
    }

    const itemsToPay = [];
    let errorMessage = "";

    listTagihanSiswa.forEach(function (t, index) {
      const chk = document.getElementById(`chk-${index}`);

      if (!chk || !chk.checked) {
        return;
      }

      const nominal =
        Number(document.getElementById(`input-bayar-${index}`).value) || 0;

      const diskon =
        Number(document.getElementById(`input-diskon-${index}`).value) || 0;

      const sisa = Number(t.sisa_tunggakan) || 0;

      if (nominal <= 0) {
        errorMessage = `Nominal pembayaran untuk ${t.nama_pos || "tagihan"} harus lebih dari Rp 0.`;
        return;
      }

      if (nominal > sisa) {
        errorMessage = `Nominal pembayaran ${t.nama_pos || "tagihan"} melebihi sisa tunggakan.`;
        return;
      }

      if (diskon < 0) {
        errorMessage = `Diskon tambahan tidak boleh negatif.`;
        return;
      }

      itemsToPay.push({
        id_tagihan: t.id_tagihan,
        nama_item_snapshot: `${t.nama_pos || t.nama_item_snapshot || "Tagihan"}${t.periode ? ` (${t.periode})` : ""}`,
        nominal_dibayar: nominal,
        diskon_tambahan: diskon,
      });
    });

    if (errorMessage) {
      alert(errorMessage);
      return;
    }

    if (!itemsToPay.length) {
      alert(
        "Pilih minimal satu item tagihan dengan nominal pembayaran lebih dari Rp 0.",
      );

      return;
    }

    const payload = {
      id_siswa: selectedSiswa.id_siswa,
      metode_pembayaran: document.getElementById("select-metode").value,
      nama_kasir: "Admin Kasir",
      catatan: document.getElementById("input-catatan").value.trim(),
      items: itemsToPay,
    };

    const btn = document.getElementById("btn-submit-bayar");

    const original = btn.innerHTML;

    btn.disabled = true;

    btn.innerHTML = `
    <i class="fa-solid fa-spinner animate-spin"></i>
    Menyimpan Transaksi...
  `;

    google.script.run

      .withSuccessHandler(function (res) {
        btn.innerHTML = original;

        if (res && res.success) {
          showModalKuitansi(res, payload);
        } else {
          btn.disabled = false;

          alert(
            "GAGAL: " + (res && res.message ? res.message : "Transaksi gagal."),
          );
        }
      })

      .withFailureHandler(function (err) {
        btn.disabled = false;

        btn.innerHTML = original;

        alert("Terjadi kesalahan sistem:\n" + err.message);
      })

      .simpanTransaksi(payload);
  }

  /* ========================================================
   KUITANSI
======================================================== */

  function showModalKuitansi(res, payload) {
    document.getElementById("kw-no").innerText = res.no_kuitansi || "-";

    document.getElementById("kw-tgl").innerText = res.tanggal || "-";

    document.getElementById("kw-kasir").innerText =
      payload.nama_kasir || "Admin Kasir";

    document.getElementById("kw-siswa-nama").innerText =
      selectedSiswa.nama || "-";

    document.getElementById("kw-siswa-nisn").innerText =
      `${selectedSiswa.nisn || "-"} / Kelas ${selectedSiswa.kelas || "-"}`;

    let html = "";

    payload.items.forEach(function (item) {
      html += `

      <div class="flex justify-between items-start">

        <div class="pr-2">

          <div class="font-bold">
            ${escapeHtml(item.nama_item_snapshot)}
          </div>

          ${
            item.diskon_tambahan > 0
              ? `
              <div class="text-[9px] text-emerald-600">
                Diskon: -${formatRupiah(item.diskon_tambahan)}
              </div>
            `
              : ""
          }

        </div>

        <div class="font-bold text-right">
          ${formatRupiah(item.nominal_dibayar)}
        </div>

      </div>

    `;
    });

    document.getElementById("kw-items-list").innerHTML = html;

    document.getElementById("kw-total").innerText = formatRupiah(
      res.total_bayar,
    );

    document.getElementById("kw-metode").innerText = getLabelMetodePembayaran(
      payload.metode_pembayaran,
    );

    if (payload.catatan) {
      document.getElementById("kw-catatan").innerText = payload.catatan;

      document
        .getElementById("kw-catatan-container")
        .classList.remove("hidden");
    } else {
      document.getElementById("kw-catatan-container").classList.add("hidden");
    }

    document.getElementById("modal-kuitansi").classList.remove("hidden");
  }

  function closeModalKuitansi() {
    document.getElementById("modal-kuitansi").classList.add("hidden");

    resetFormKasir();
  }

  function resetFormKasir() {
    selectedSiswa = null;
    listTagihanSiswa = [];

    document.getElementById("input-search").value = "";
    document.getElementById("input-catatan").value = "";

    document.getElementById("search-dropdown").classList.add("hidden");

    document.getElementById("student-info-box").classList.add("hidden");

    document.getElementById("student-empty-box").classList.remove("hidden");

    document.getElementById("payment-options").classList.add("hidden");

    document.getElementById("checkout-box").classList.add("hidden");

    document.getElementById("tagihan-count").innerText = "0 Item Tagihan";

    document.getElementById("summary-items-count").innerText = "0 Item";

    document.getElementById("summary-total-bayar").innerText = "Rp 0";

    document.getElementById("btn-submit-bayar").disabled = true;

    document.getElementById("tagihan-container").innerHTML = `
    <div class="flex flex-col items-center justify-center h-48 text-slate-400">

      <i class="fa-solid fa-receipt text-4xl mb-2"></i>

      <p class="text-sm">
        Belum ada siswa terpilih
      </p>

    </div>
  `;
  }

  /* ========================================================
   RIWAYAT TRANSAKSI
======================================================== */

  function handleRiwayatKeyup(e) {
    if (e.key === "Enter") {
      loadRiwayatTransaksiJS();
    }
  }
  let currentPageRiwayat = 1;
  const LIMIT_RIWAYAT = 10;

  function loadRiwayatTransaksiJS(page) {
    page = Math.max(1, parseInt(page, 10) || 1);
    currentPageRiwayat = page;

    const tbody = document.getElementById("table-riwayat-body");
    const keyword = document.getElementById("riwayat-keyword").value.trim();
    const tanggalMulai = document.getElementById("riwayat-tanggal-mulai").value;
    const tanggalSelesai = document.getElementById(
      "riwayat-tanggal-selesai",
    ).value;
    const metode = document.getElementById("riwayat-metode").value;

    tbody.innerHTML = `
    <tr>
      <td colspan="8" class="p-10 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-2 text-emerald-600"></i>
        <p class="text-xs">Memuat riwayat transaksi...</p>
      </td>
    </tr>
  `;

    google.script.run
      .withSuccessHandler(function (res) {
        renderRiwayatTransaksiJS(res);
      })
      .withFailureHandler(function (err) {
        tbody.innerHTML = `
        <tr>
          <td colspan="8" class="p-6 text-center text-rose-500 font-semibold">
            Gagal memuat riwayat: ${escapeHtml(err.message)}
          </td>
        </tr>
      `;
        document.getElementById("riwayat-pagination").classList.add("hidden");
      })
      .getRiwayatTransaksi({
        keyword: keyword,
        tanggal_mulai: tanggalMulai,
        tanggal_selesai: tanggalSelesai,
        metode: metode,
        page: page,
        limit: LIMIT_RIWAYAT,
      });
  }

  function renderRiwayatTransaksiJS(res) {
    const tbody = document.getElementById("table-riwayat-body");
    const pagination = document.getElementById("riwayat-pagination");
    const info = document.getElementById("riwayat-info");
    const pageInfo = document.getElementById("riwayat-page-info");
    const btnPrev = document.getElementById("btn-riwayat-prev");
    const btnNext = document.getElementById("btn-riwayat-next");

    // Summary cards
    let totalNominal = 0;
    const data = res && res.data ? res.data : [];
    const total = res && res.total ? res.total : 0;
    const page = res && res.page ? res.page : 1;
    const totalPages = res && res.total_pages ? res.total_pages : 1;

    data.forEach(function (trx) {
      totalNominal += Number(trx.total_bayar) || 0;
    });

    document.getElementById("riwayat-total-transaksi").innerText =
      `${total} Transaksi`;
    document.getElementById("riwayat-total-nominal").innerText =
      formatRupiah(totalNominal); // Catatan: ini hanya total halaman saat ini
    document.getElementById("riwayat-total-data").innerText =
      `${data.length} Data`;

    // Pagination UI
    const start = total === 0 ? 0 : (page - 1) * LIMIT_RIWAYAT + 1;
    const end = Math.min(page * LIMIT_RIWAYAT, total);

    info.innerText = `Menampilkan ${start}–${end} dari ${total} data`;
    pageInfo.innerText = `${page} / ${totalPages}`;
    btnPrev.disabled = page <= 1;
    btnNext.disabled = page >= totalPages;
    pagination.classList.remove("hidden");

    if (!data.length) {
      tbody.innerHTML = `
      <tr>
        <td colspan="8" class="p-10 text-center text-slate-400">
          <i class="fa-solid fa-receipt text-3xl mb-2"></i>
          <p class="text-sm font-semibold">Tidak ada transaksi ditemukan.</p>
          <p class="text-xs mt-1">Coba ubah kata kunci atau filter.</p>
        </td>
      </tr>
    `;
      return;
    }

    let html = "";

    data.forEach(function (trx) {
      html += `
      <tr class="hover:bg-slate-50 transition">
        <td class="p-4 whitespace-nowrap">
          <div class="font-semibold text-slate-800">
            ${escapeHtml(trx.tanggal || "-")}
          </div>
        </td>
        <td class="p-4 whitespace-nowrap">
          <div class="font-bold text-emerald-700">
            ${escapeHtml(trx.no_kuitansi || "-")}
          </div>
          <div class="text-[10px] text-slate-400">
            ${escapeHtml(trx.id_transaksi || "-")}
          </div>
        </td>
        <td class="p-4">
          <div class="font-bold text-slate-800">
            ${escapeHtml(trx.nama_siswa || "-")}
          </div>
          <div class="text-xs text-slate-500">
            NISN: ${escapeHtml(trx.nisn || "-")}
            |
            NIS: ${escapeHtml(trx.nis || "-")}
          </div>
        </td>
        <td class="p-4">
          <span class="px-2 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold">
            ${escapeHtml(trx.kelas || "-")}
          </span>
        </td>

  function loadRekapLaporanLunasJS() {
    const idPos = document.getElementById("filter-pos-lunas").value || "ALL";
    const tbody = document.getElementById("table-rekap-lunas-body");

    if (!tbody) {
      return;
    }

    tbody.innerHTML = `

          <p class="text-xs">Memuat rekapitulasi siswa lunas...</p>
        </td>
      </tr>
    `;

    google.script.run
      .withSuccessHandler(function (data) {
        data = Array.isArray(data) ? data : [];

        let totalSiswaLunas = 0;
        let totalTagihan = 0;
        let totalDibayar = 0;
        let totalDiskon = 0;
        let totalEfektif = 0;

        if (!data.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400">
                Tidak ada data siswa lunas.
              </td>
            </tr>
          `;

          document.getElementById("card-total-lunas").innerText = "0 Siswa";
          document.getElementById("card-total-tagihan-lunas").innerText = "Rp 0";
          document.getElementById("card-total-dibayar-lunas").innerText = "Rp 0";
          document.getElementById("card-total-diskon-lunas").innerText = "Rp 0";
          document.getElementById("card-total-efektif-lunas").innerText = "Rp 0";

          return;
        }

        let html = "";

        data.forEach(function (r) {
          const siswaLunas = Number(r.siswa_lunas) || 0;
          const totalTagihanKelas = Number(r.total_tagihan) || 0;
          const totalDibayarKelas = Number(r.total_dibayar) || 0;
          const totalDiskonKelas = Number(r.total_diskon) || 0;
          const totalEfektifKelas = Number(r.total_pelunasan_efektif) || 0;

          totalSiswaLunas += siswaLunas;
          totalTagihan += totalTagihanKelas;
          totalDibayar += totalDibayarKelas;
          totalDiskon += totalDiskonKelas;
          totalEfektif += totalEfektifKelas;

          html += `
            <tr class="hover:bg-slate-50 transition">
              <td class="p-4 font-bold text-slate-800">${escapeHtml(r.kelas)}</td>
              <td class="p-4 text-right">
                <button type="button"
                  onclick="openModalLunasKelas(decodeURIComponent('${encodeURIComponent(r.kelas)}'), decodeURIComponent('${encodeURIComponent(idPos)}'))"
                  class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold transition"
                  title="Lihat daftar siswa lunas">
                  <i class="fa-solid fa-users"></i>
                  ${siswaLunas} Siswa
                </button>
              </td>
              <td class="p-4 text-right font-semibold text-slate-700">${formatRupiah(totalTagihanKelas)}</td>
              <td class="p-4 text-right text-slate-700">${formatRupiah(totalDibayarKelas)}</td>
              <td class="p-4 text-right text-amber-600">${formatRupiah(totalDiskonKelas)}</td>
              <td class="p-4 text-right font-bold text-emerald-700">${formatRupiah(totalEfektifKelas)}</td>
              <td class="p-4 text-center">
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold">
                  <i class="fa-solid fa-circle-check"></i>
                  LUNAS
                </span>
              </td>
            </tr>
          `;
        });

        tbody.innerHTML = html;

        document.getElementById("card-total-lunas").innerText =
          `${totalSiswaLunas} Siswa`;
        document.getElementById("card-total-tagihan-lunas").innerText =
          formatRupiah(totalTagihan);
        document.getElementById("card-total-dibayar-lunas").innerText =
          formatRupiah(totalDibayar);
        document.getElementById("card-total-diskon-lunas").innerText =
          formatRupiah(totalDiskon);
        document.getElementById("card-total-efektif-lunas").innerText =
          formatRupiah(totalEfektif);
      })
      .withFailureHandler(function (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="p-5 text-center text-rose-500 font-semibold">
              Gagal memuat laporan lunas:
              ${escapeHtml(err.message)}
            </td>
          </tr>
        `;
      })
      .getRekapLunasPerKelas(idPos);
  }

  /* ========================================================
   LAPORAN LUNAS - MODAL DAFTAR SISWA
======================================================== */

  function openModalLunasKelas(kelas, idPos) {
    const modal = document.getElementById("modal-lunas-kelas");
    const tbody = document.getElementById("table-modal-lunas-body");
    const title = document.getElementById("modal-lunas-kelas-title");
    const subtitle = document.getElementById("modal-lunas-kelas-subtitle");
    const summary = document.getElementById("modal-lunas-kelas-summary");

    if (!modal || !tbody) {
      return;
    }

    currentModalLunasKelas = kelas || null;
    currentModalLunasPos = idPos || "ALL";
    currentModalLunasData = [];

    title.innerText = "Daftar Siswa Lunas - " + (kelas || "");
    subtitle.innerText = "Memuat daftar siswa...";
    summary.innerText = "Memuat...";

    tbody.innerHTML = "<tr><td colspan=\"9\" class=\"p-8 text-center text-slate-400\"><i class=\"fa-solid fa-circle-notch animate-spin text-2xl mb-2 text-emerald-600\"></i><p class=\"text-xs\">Memuat daftar siswa lunas...</p></td></tr>";

    modal.classList.remove("hidden");
    modal.classList.add("flex");

    google.script.run
      .withSuccessHandler(function (data) {
        currentModalLunasData = Array.isArray(data) ? data : [];
        const selectPos = document.getElementById("filter-pos-lunas");
        let namaPos = "Semua Pos Pembayaran";

        if (selectPos && currentModalLunasPos !== "ALL") {
          const optionPos = Array.from(selectPos.options).find(function (option) {
            return option.value === currentModalLunasPos;
          });
          if (optionPos) {
            namaPos = optionPos.textContent.trim();
          }
        }

        subtitle.innerText = "Pos: " + namaPos;
        summary.innerText = currentModalLunasData.length + " Siswa Lunas";

        if (!currentModalLunasData.length) {
          tbody.innerHTML = "<tr><td colspan=\"9\" class=\"p-8 text-center text-slate-400\">Tidak ada siswa lunas untuk kelas ini.</td></tr>";
          return;
        }

        let html = "";

        currentModalLunasData.forEach(function (siswa, index) {
          html += "<tr class=\"border-b border-slate-100 hover:bg-slate-50 transition\">";
          html += "<td class=\"p-3 text-center text-slate-500\">" + (index + 1) + "</td>";
          html += "<td class=\"p-3 text-left text-slate-700\">" + escapeHtml(siswa.nisn) + "</td>";
          html += "<td class=\"p-3 text-left text-slate-700\">" + escapeHtml(siswa.nis) + "</td>";
          html += "<td class=\"p-3 text-left font-semibold text-slate-800\">" + escapeHtml(siswa.nama_lengkap) + "</td>";
          html += "<td class=\"p-3 text-left text-slate-700\">" + escapeHtml(siswa.kelas) + "</td>";
          html += "<td class=\"p-3 text-right text-slate-700\">" + formatRupiah(siswa.total_tagihan) + "</td>";
          html += "<td class=\"p-3 text-right text-slate-700\">" + formatRupiah(siswa.total_dibayar) + "</td>";
          html += "<td class=\"p-3 text-right text-amber-600\">" + formatRupiah(siswa.total_diskon) + "</td>";
          html += "<td class=\"p-3 text-right font-bold text-emerald-700\">" + formatRupiah(siswa.total_pelunasan_efektif) + "</td>";
          html += "</tr>";
        });

        tbody.innerHTML = html;
      })
      .withFailureHandler(function (err) {
        currentModalLunasData = [];
        subtitle.innerText = "Gagal memuat data.";
        summary.innerText = "0 Siswa Lunas";
        tbody.innerHTML = "<tr><td colspan=\"9\" class=\"p-8 text-center text-rose-500 font-semibold\">Gagal memuat daftar siswa lunas: " + escapeHtml(err && err.message ? err.message : "Terjadi kesalahan.") + "</td></tr>";
      })
      .getSiswaLunasForLaporan(currentModalLunasPos, currentModalLunasKelas, "");
  }

  function exportModalLunasExcel() {
    if (!currentModalLunasKelas) {
      alert("Kelas laporan belum ditentukan.");
      return;
    }

    if (!currentModalLunasData || currentModalLunasData.length === 0) {
      alert("Tidak ada data siswa lunas yang dapat diekspor.");
      return;
    }

    if (typeof XLSX === "undefined") {
      alert("Library Excel belum tersedia. Silakan muat ulang halaman.");
      return;
    }

    const btns = document.querySelectorAll("#modal-lunas-kelas button");
    let excelButton = null;

    btns.forEach(function (btn) {
      if (btn.innerText && btn.innerText.toLowerCase().includes("excel")) {
        excelButton = btn;
      }
    });

    const originalHtml = excelButton ? excelButton.innerHTML : "";

    try {
      if (excelButton) {
        excelButton.disabled = true;
        excelButton.innerHTML = `
          <i class="fa-solid fa-spinner animate-spin"></i>
          <span>Memproses...</span>
        `;
      }

      const now = new Date();
      const tanggalCetak = now.toLocaleString("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });

      const namaPos = currentModalLunasPos &&
        currentModalLunasPos.toUpperCase() !== "ALL"
        ? currentModalLunasPos
        : "Semua Pos Pembayaran";

      const rows = [
        ["DAFTAR SISWA LUNAS"],
        [
          "Kelas",
          currentModalLunasKelas || "Semua Kelas",
          "Pos Pembayaran",
          namaPos,
        ],
        ["Tanggal Cetak", tanggalCetak],
        [],
        [
          "No",
          "NISN",
          "NIS",
          "Nama Siswa",
          "Kelas",
          "Total Tagihan",
          "Dibayar",
          "Diskon",
          "Pelunasan Efektif",
        ],
      ];

      currentModalLunasData.forEach(function (siswa, index) {
        rows.push([
          index + 1,
          siswa.nisn || "",
          siswa.nis || "",
          siswa.nama_lengkap || "",
          siswa.kelas || "",
          Number(siswa.total_tagihan) || 0,
          Number(siswa.total_dibayar) || 0,
          Number(siswa.total_diskon) || 0,
          Number(siswa.total_pelunasan_efektif) || 0,
        ]);
      });

      const worksheet = XLSX.utils.aoa_to_sheet(rows);

      worksheet["!cols"] = [
        { wch: 6 },
        { wch: 18 },
        { wch: 15 },
        { wch: 30 },
        { wch: 12 },
        { wch: 18 },
        { wch: 18 },
        { wch: 18 },
        { wch: 22 },
      ];

      const lastRow = rows.length - 1;

      if (worksheet["F6"]) {
        worksheet["F6"].z = "#,##0";
      }

      for (let row = 6; row <= lastRow; row++) {
        ["F", "G", "H", "I"].forEach(function (col) {
          const cell = worksheet[col + row];
          if (cell) {
            cell.z = "#,##0";
          }
        });
      }

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Siswa Lunas"
      );

      const fileName =
        "Daftar_Siswa_Lunas_" +
        (currentModalLunasKelas || "Semua_Kelas") +
        "_" +
        now.toISOString().slice(0, 10).replace(/-/g, "") +
        "_" +
        now.toTimeString().slice(0, 8).replace(/:/g, "") +
        ".xlsx";

      const excelBuffer = XLSX.write(workbook, {
        bookType: "xlsx",
        type: "array",
      });

      const blob = new Blob(
        [excelBuffer],
        {
          type:
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        }
      );

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);

      if (excelButton) {
        excelButton.disabled = false;
        excelButton.innerHTML = originalHtml;
      }

      alert(
        "File Excel berhasil dibuat dan siap diunduh."
      );
    } catch (err) {
      if (excelButton) {
        excelButton.disabled = false;
        excelButton.innerHTML = originalHtml;
      }

      console.error("Gagal export Laporan Lunas:", err);

      alert(
        "Gagal membuat file Excel:\n\n" +
          (err && err.message
            ? err.message
            : "Terjadi kesalahan.")
      );
    }
  }

    if (!data || data.length === 0) {
      document.getElementById("modal-total-siswa").innerText = "0 Siswa";

      document.getElementById("modal-total-sisa").innerText = "Rp 0";

        : 100;

      const status = totalSisaSiswa <= 0

    });

    content.innerHTML = html;
  }

  /**
   * DETAIL ITEM TAGIHAN
   */
  function renderDetailTagihanModal(tagihan) {
    if (!tagihan || tagihan.length === 0) {
      return `
      <div class="text-xs text-slate-400">

    return tagihan

        const nominal = Number(t.nominal_akhir) || 0;
        const terbayar = Number(t.terbayar) || 0;
        const diskon = Number(t.diskon_tambahan_total) || 0;

        const efektif = Math.min(
          nominal,
          Math.max(0, terbayar + diskon)
        );

        const sisa = Math.max(0, nominal - efektif);

        const progress = nominal > 0
          ? Math.max(0, Math.min(100, (efektif / nominal) * 100))
          : 100;

        return `
      <div class="border border-slate-200 rounded-xl p-3">

        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">

          <div>
            <div class="font-bold text-sm text-slate-700">
              ${escapeHtmlLaporan(t.nama_item)}
              ${
                t.periode
                  ? `<span class="text-slate-400 font-normal">(${escapeHtmlLaporan(t.periode)})</span>`
                  : ""
              }
            </div>

            <div class="text-[11px] text-slate-400 mt-0.5">
              ${escapeHtmlLaporan(t.id_tagihan)}
            </div>
          </div>

          <div class="text-right">
            <div class="text-xs text-slate-400">
              Sisa
            </div>

            <div class="font-black text-rose-600">
              ${formatRupiah(sisa)}
            </div>
          </div>

        </div>

        <div class="mt-3 flex items-center gap-3">

          <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
            <div
              class="h-full rounded-full ${
                progress > 0 ? "bg-amber-500" : "bg-rose-500"
              }"
              style="width:${progress}%"
            ></div>
          </div>

          <span class="text-[11px] font-bold text-slate-500 w-10 text-right">
            ${progress}%

      .join("&lt;")
      .split(">")
      .join("&gt;")

      return;

    const kelas = currentModalTunggakanKelas || "-";

    let totalTagihan = 0;
    let totalDibayar = 0;
    let totalSisa = 0;

    currentModalTunggakanData.forEach(function (siswa) {
      const tagihan = Array.isArray(siswa.tagihan)
        ? siswa.tagihan

          nominal,
          Math.max(0, terbayar + diskon)
        );

        totalTagihan += nominal;
        totalDibayar += terbayar;
        totalSisa += Math.max(0, nominal - efektif);
      });
    });

    if (excelButton) {
      excelButton.disabled = true;
      excelButton.innerHTML = `
      <i class="fa-solid fa-spinner animate-spin"></i>
      <span>Memproses...</span>
    `;
    }

    google.script.run

      .withSuccessHandler(function (res) {
        if (excelButton) {
          excelButton.disabled = false;
          excelButton.innerHTML = originalHtml;
        }

        if (!res || !res.success) {
          alert(
            res && res.message ? res.message : "Gagal membuat laporan Excel.",
          );
          return;
        }

        showConfirmation(
          res.message +
            "\n\n" +
            "Nama Sheet: " +
            res.sheetName +
            "\n\n" +
            "Buka Google Spreadsheet sekarang?",
        ).then(function (buka) {
          if (buka && res.spreadsheetUrl) {
            window.open(res.spreadsheetUrl, "_blank");
          }
        });
      })

      .withFailureHandler(function (err) {
        if (excelButton) {
          excelButton.disabled = false;
          excelButton.innerHTML = originalHtml;
        }

        alert(
          "Gagal membuat laporan Excel:\n\n" +
            (err && err.message ? err.message : "Terjadi kesalahan."),
        );
      })

      .exportDetailTunggakanToSheet(
        currentModalTunggakanKelas,
        currentModalTunggakanPos,
      );

  function updateSelectedSiswaCountJS() {
    const checkboxes = document.querySelectorAll(".setting-siswa-chk");
    const checked = document.querySelectorAll(".setting-siswa-chk:checked");
    const countLabel = document.getElementById("setting-siswa-count");
    const btnGenerate = document.getElementById("btn-generate-tagihan");
    const checkAll = document.getElementById("setting-check-all");

    const total = checkboxes.length;
    const selected = checked.length;

    countLabel.innerText = `${selected} dipilih`;

    // Update status "Pilih Semua"
    if (total > 0) {
      checkAll.checked = selected === total;
      checkAll.indeterminate = selected > 0 && selected < total;
    }

    // Enable tombol generate jika ada yang dipilih
    btnGenerate.disabled = selected === 0;
  }

  let generateProgressTimer = null;

  function updateGenerateProgress(percent, status) {
    const safePercent = Math.max(0, Math.min(100, Math.round(percent)));
    const bar = document.getElementById("generate-progress-bar");
    const label = document.getElementById("generate-progress-label");
    const statusLabel = document.getElementById("generate-progress-status");

    if (bar) bar.style.width = safePercent + "%";
    if (label) label.innerText = safePercent + "%";
    if (statusLabel && status) statusLabel.innerText = status;
  }

  function showGenerateProgress(total) {
    const modal = document.getElementById("modal-generate-progress");
    const subtitle = document.getElementById("generate-progress-subtitle");
    const count = document.getElementById("generate-progress-count");

    if (!modal) return;

    modal.classList.remove("hidden");
    modal.classList.add("flex");
    if (subtitle) subtitle.innerText = "Menyiapkan tagihan untuk siswa...";
    if (count) count.innerText = total + " siswa dipilih";
    updateGenerateProgress(5, "Memulai...");

    let percent = 5;
    generateProgressTimer = setInterval(function () {
      percent = Math.min(percent + 3, 90);
      updateGenerateProgress(percent, "Memproses data...");
    }, 350);
  }

  function hideGenerateProgress(success) {
    if (generateProgressTimer) {
      clearInterval(generateProgressTimer);
      generateProgressTimer = null;
    }

    updateGenerateProgress(success ? 100 : 0, success ? "Selesai" : "Gagal");

    const modal = document.getElementById("modal-generate-progress");
    if (modal) {
      setTimeout(
        function () {
          modal.classList.add("hidden");
          modal.classList.remove("flex");
        },
        success ? 450 : 0,
      );
    }
  }

  /**
 * Generate tagihan massal
 */
function generateTagihanMassalJS() {
  var kelas = document.getElementById('setting-kelas').value;
  var idPos = document.getElementById('setting-pos').value;
  var periode = document.getElementById('setting-periode').value;
  var nominal = document.getElementById('setting-nominal').value;
  var idPotongan = document.getElementById('setting-potongan').value;
  var bisaDicicil = document.getElementById('setting-bisa-dicicil').checked;
  var catatan = document.getElementById('setting-catatan').value;
  
  // Validasi
  if (!kelas) {
    Swal.fire({
      icon: 'warning',
      title: 'Peringatan',
      text: 'Silakan pilih kelas terlebih dahulu.',
      confirmButtonColor: '#f59e0b'
    });
    return;
  }
  
  if (!idPos) {
    Swal.fire({
      icon: 'warning',
      title: 'Peringatan',
      text: 'Silakan pilih pos pembayaran.',
      confirmButtonColor: '#f59e0b'
    });
    return;
  }
  
  if (!periode) {
    Swal.fire({
      icon: 'warning',
      title: 'Peringatan',
      text: 'Silakan isi periode tagihan.',
      confirmButtonColor: '#f59e0b'
    });
    return;
  }
  
  // Ambil siswa yang dipilih
  var checkboxes = document.querySelectorAll('.siswa-checkbox:checked');
  if (checkboxes.length === 0) {
    Swal.fire({
      icon: 'warning',
      title: 'Peringatan',
      text: 'Silakan pilih minimal satu siswa.',
      confirmButtonColor: '#f59e0b'
    });
    return;
  }
  
  var idSiswaList = [];
  checkboxes.forEach(function(cb) {
    idSiswaList.push(cb.value);
  });
  
  // Konfirmasi
  var totalSiswa = idSiswaList.length;
  var posName = document.getElementById('setting-pos').options[document.getElementById('setting-pos').selectedIndex]?.text || idPos;
  
  Swal.fire({
    title: 'Konfirmasi Generate Tagihan',
    html: `
      <div style="text-align: left; padding: 10px 0;">
        <p><strong>Jumlah Siswa:</strong> ${totalSiswa} siswa</p>
        <p><strong>Pos Pembayaran:</strong> ${posName}</p>
        <p><strong>Periode:</strong> ${periode}</p>
        <p><strong>Nominal:</strong> ${nominal ? 'Rp ' + Number(nominal).toLocaleString('id-ID') : 'Default (dari master)'}</p>
        <p><strong>Potongan:</strong> ${idPotongan ? 'Ya' : 'Default Siswa'}</p>
        <p><strong>Bisa Dicicil:</strong> ${bisaDicicil ? 'Ya' : 'Tidak'}</p>
        ${catatan ? '<p><strong>Catatan:</strong> ' + catatan + '</p>' : ''}
      </div>
    `,
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#10b981',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'Ya, Generate!',
    cancelButtonText: 'Batal'
  }).then(function(result) {
    if (result.isConfirmed) {
      // Tampilkan progress
      showLoading('Mengenerate tagihan...');
      
      var payload = {
        id_pos: idPos,
        periode: periode,
        nominal: parseFloat(nominal) || 0,
        id_potongan: idPotongan || '',
        bisa_dicicil: bisaDicicil,
        catatan: catatan || '',
        id_siswa_list: idSiswaList
      };
      
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          if (result.success) {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil!',
              text: result.message,
              confirmButtonColor: '#10b981'
            }).then(function() {
              // ============================================
              // REFRESH DATA SETELAH GENERATE SELESAI
              // ============================================
              
              // 1. Refresh data siswa di form setting
              loadSiswaByKelasJS();
              
              // 2. Refresh riwayat tagihan "Berdasarkan Kelas"
              // Cek tab mana yang aktif
              var isKelasActive = !document.getElementById('riwayat-tab-kelas').classList.contains('hidden');
              if (isKelasActive) {
                // Jika tab kelas aktif, refresh langsung
                searchRiwayatKelas(riwayatKelasPage);
              } else {
                // Jika tidak, set flag agar refresh saat tab diaktifkan
                window._kelasLoaded = false;
                // Refresh juga di background
                setTimeout(function() {
                  searchRiwayatKelas(1);
                }, 500);
              }
              
              // 3. Refresh riwayat "Berdasarkan Siswa" juga
              var isSiswaActive = !document.getElementById('riwayat-tab-siswa').classList.contains('hidden');
              if (isSiswaActive) {
                searchRiwayatSiswa(riwayatSiswaPage);
              } else {
                window._siswaLoaded = false;
              }
              
              // 4. Reset checkbox "Pilih Semua"
              var checkAll = document.getElementById('setting-check-all');
              if (checkAll) {
                checkAll.checked = false;
                checkAll.indeterminate = false;
              }
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Gagal Generate',
              text: result.message,
              confirmButtonColor: '#dc2626'
            });
          }
        })
        .withFailureHandler(function(err) {
          hideLoading();
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Terjadi kesalahan: ' + err.message,
            confirmButtonColor: '#dc2626'
          });
        })
        .generateTagihanMassal(payload);
    }
  });
}

    const pageInfo = document.getElementById("riwayat-setting-page-info");

      return;
    }

    const data = res.data || [];
    const total = res.total || 0;
    const page = res.page || 1;
    const totalPages = res.total_pages || 1;

    // Update pagination info
    const start = total === 0 ? 0 : (page - 1) * LIMIT_RIWAYAT_SETTING + 1;
    const end = Math.min(page * LIMIT_RIWAYAT_SETTING, total);

            title="Hapus tagihan ini"
          >
            <i class="fa-solid fa-trash text-xs"></i>

    tbody.innerHTML = html;

  function hapusTagihanSiswaJS(idTagihanEncoded) {
    const idTagihan = decodeURIComponent(idTagihanEncoded || "");

    showConfirmation(
      "Yakin ingin menghapus tagihan " +
        idTagihan +
        "?\nTindakan ini tidak dapat dibatalkan.",
    ).then(function (confirmed) {

      google.script.run

                (res && res.message ? res.message : "Terjadi kesalahan."),
            );
          }
        })
        .withFailureHandler(function (err) {
          alert("Terjadi kesalahan: " + (err.message || err));
        })
        .hapusTagihanSiswa(idTagihan);
    });

  ///viewmodular
  /* ========================================================
   MASTER DATA (MODULAR)
======================================================== */

  let currentMasterSheet = "Master_Pos";
  let currentMasterHeaders = [];
  let currentMasterPrimaryKey = "id_pos";
  let currentMasterData = [];
  let currentMasterEditRowIndex = null;
  let listPosPembayaran = []; // cache data Pos_Pembayaran
  const MASTER_LABELS = {
    Master_Pos: "Master Pos",
    Master_Potongan: "Master Potongan",
    Pos_Pembayaran: "Pos Pembayaran",
  };

  // Kolom yang dianggap boolean
  const BOOLEAN_COLUMNS = ["aktif", "bisa_dicicil"];

  // Kolom yang sebaiknya number
  const NUMBER_COLUMNS = [
    "tarif_default",
    "nilai_potongan",
    "nominal_asal",
    "nominal_akhir",
    "terbayar",
    "sisa_tunggakan",
    "nominal_potongan",
  ];

  function switchMasterTab(sheetName) {
    currentMasterSheet = sheetName;
    currentMasterEditRowIndex = null;

    // Update tampilan tab
    document.querySelectorAll(".master-tab").forEach(function (btn) {
      btn.classList.remove(
        "border-emerald-600",
        "text-emerald-700",
        "bg-emerald-50",
      );
      btn.classList.add("border-transparent", "text-slate-500");
    });

    const activeBtn = document.getElementById("master-tab-" + sheetName);
    if (activeBtn) {
      activeBtn.classList.remove("border-transparent", "text-slate-500");
      activeBtn.classList.add(
        "border-emerald-600",
        "text-emerald-700",
        "bg-emerald-50",
      );
    }

    document.getElementById("master-sheet-label").innerText =
      MASTER_LABELS[sheetName] || sheetName;

    loadMasterDataJS();
  }

  function loadMasterDataJS() {
    const thead = document.getElementById("master-table-head");
    const tbody = document.getElementById("master-table-body");

    thead.innerHTML = `<th class="p-4">Memuat...</th>`;
    tbody.innerHTML = `
    <tr>
      <td class="p-10 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-2 text-emerald-600"></i>
        <p class="text-sm">Memuat data...</p>
      </td>
    </tr>
  `;

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          tbody.innerHTML = `
          <tr>
            <td class="p-8 text-center text-rose-500">
              Gagal memuat data.
            </td>
          </tr>
        `;
          return;
        }

        currentMasterHeaders = res.headers || [];
        currentMasterPrimaryKey = res.primaryKey || "id";
        currentMasterData = res.data || [];

        document.getElementById("master-total-data").innerText =
          "• " + currentMasterData.length + " data";

        renderMasterTableJS();
      })
      .withFailureHandler(function (err) {
        tbody.innerHTML = `
        <tr>
          <td class="p-8 text-center text-rose-500 font-semibold">
            Gagal: ${escapeHtml(err.message)}
          </td>
        </tr>
      `;
      })
      .getMasterData(currentMasterSheet);
  }

  function renderMasterTableJS() {
    const thead = document.getElementById("master-table-head");
    const tbody = document.getElementById("master-table-body");

    if (!currentMasterHeaders.length) {
      thead.innerHTML = `<th class="p-4">Tidak ada kolom</th>`;
      tbody.innerHTML = `
      <tr>
        <td class="p-8 text-center text-slate-400">Sheet kosong.</td>
      </tr>
    `;
      return;
    }

    // Header
    let headHtml = currentMasterHeaders
      .map(function (h) {
        return `<th class="p-3 whitespace-nowrap text-xs uppercase tracking-wide">${escapeHtml(h)}</th>`;
      })
      .join("");

    headHtml += `<th class="p-3 text-center whitespace-nowrap text-xs uppercase">Aksi</th>`;
    thead.innerHTML = `<tr>${headHtml}</tr>`;

    // Body
    if (!currentMasterData.length) {
      tbody.innerHTML = `
      <tr>
        <td colspan="${currentMasterHeaders.length + 1}" class="p-10 text-center text-slate-400">
          <i class="fa-solid fa-inbox text-3xl mb-2"></i>
          <p class="text-sm">Belum ada data.</p>
        </td>
      </tr>
    `;
      return;
    }

    let bodyHtml = "";

    currentMasterData.forEach(function (row) {
      bodyHtml += `<tr class="hover:bg-slate-50 transition">`;

      currentMasterHeaders.forEach(function (header) {
        let value = row[header];
        let display = "";

        // Kolom TRUE / FALSE
        if (header === "aktif" || header === "bisa_dicicil") {
          const isTrue =
            value === true ||
            value === "TRUE" ||
            value === "true" ||
            value === 1 ||
            value === "1";

          display = isTrue
            ? `<span class="inline-flex px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold">TRUE</span>`
            : `<span class="inline-flex px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-600 text-xs font-bold">FALSE</span>`;
        }
        // Kolom tipe_nilai
        else if (header === "tipe_nilai") {
          display = `<span class="inline-flex px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold">${escapeHtml(
            String(value || "").toUpperCase(),
          )}</span>`;
        }
        // Kolom tipe_pos
        else if (header === "tipe_pos") {
          display = `<span class="inline-flex px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-700 text-xs font-bold">${escapeHtml(
            String(value || "").toUpperCase(),
          )}</span>`;
        }
        // Kolom angka
        else if (
          NUMBER_COLUMNS.indexOf(header) !== -1 &&
          value !== "" &&
          value !== null &&
          value !== undefined
        ) {
          display = formatRupiah(value);
        }
        // Default
        else {
          display = escapeHtml(
            value === null || value === undefined ? "" : String(value),
          );
        }

        bodyHtml += `<td class="p-3 text-sm">${display}</td>`;
      });

      // Tombol Aksi
      bodyHtml += `
      <td class="p-3 text-center whitespace-nowrap">
        <button
          onclick='editMasterRowJS(${row._rowIndex})'
          class="w-8 h-8 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-600 transition mr-1"
          title="Edit"
        >
          <i class="fa-solid fa-pen text-xs"></i>
        </button>
        <button
          onclick='deleteMasterRowJS(${row._rowIndex})'
          class="w-8 h-8 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 transition"
          title="Hapus"
        >
          <i class="fa-solid fa-trash text-xs"></i>
        </button>
      </td>
    `;

      bodyHtml += `</tr>`;
    });

    tbody.innerHTML = bodyHtml;
  }

  /* ========== FORM TAMBAH / EDIT ========== */

  /* ========================================================
   MASTER DATA - KONFIGURASI KOLOM
======================================================== */

  // Kolom yang pakai dropdown
  const SELECT_COLUMNS = {
    tipe_nilai: ["NOMINAL", "PERSEN"],
    tipe_pos: [
      "BULANAN",
      "SEKALI",
      "KEGIATAN",
      "TAHUNAN",
      "SEMESTER",
      "LAINNYA",
    ],
    aktif: ["TRUE", "FALSE"],
    bisa_dicicil: ["TRUE", "FALSE"],
  };

  /* ========================================================
   FORM TAMBAH / EDIT (dengan Select dinamis)
======================================================== */

  function openMasterFormJS(rowIndex) {
    currentMasterEditRowIndex = rowIndex || null;

    const isEdit = !!rowIndex;
    const title = isEdit ? "Edit Data" : "Tambah Data";
    const subtitle = MASTER_LABELS[currentMasterSheet] || currentMasterSheet;

    document.getElementById("master-form-title").innerText = title;
    document.getElementById("master-form-subtitle").innerText = subtitle;

    // Jika sedang di Master_Pos dan mode Tambah → ambil data Pos_Pembayaran dulu
    if (currentMasterSheet === "Master_Pos" && !isEdit) {
      loadPosPembayaranForMasterJS(function () {
        buildMasterFormFields(isEdit, rowIndex);
      });
    } else {
      buildMasterFormFields(isEdit, rowIndex);
    }
  }

  function buildMasterFormFields(isEdit, rowIndex) {
    const form = document.getElementById("master-form");
    form.innerHTML = "";

    // Data yang sedang diedit
    let editData = {};
    if (isEdit) {
      editData =
        currentMasterData.find(function (r) {
          return Number(r._rowIndex) === Number(rowIndex);
        }) || {};
    }

    currentMasterHeaders.forEach(function (header) {
      if (header === "_rowIndex") return;

      let value =
        editData[header] !== undefined && editData[header] !== null
          ? editData[header]
          : "";

      // Normalisasi boolean
      if (header === "aktif" || header === "bisa_dicicil") {
        const isTrue =
          value === true ||
          value === "TRUE" ||
          value === "true" ||
          value === 1 ||
          value === "1";
        value = isTrue ? "TRUE" : "FALSE";
      }

      // Normalisasi tipe_nilai
      if (header === "tipe_nilai") {
        value = String(value).toUpperCase();
        if (value !== "PERSEN") value = "NOMINAL";
      }

      const isNumber = NUMBER_COLUMNS.indexOf(header) !== -1;
      const isPrimary = header === currentMasterPrimaryKey;
      const isReadonly = isEdit && isPrimary;
      const hasSelect = SELECT_COLUMNS.hasOwnProperty(header);

      let fieldHtml = "";

      // =====================================================
      // KHUSUS Master_Pos + mode TAMBAH
      // id_pos, kode_pos, nama_pos diambil dari Pos_Pembayaran
      // =====================================================
      if (
        currentMasterSheet === "Master_Pos" &&
        !isEdit &&
        (header === "id_pos" || header === "kode_pos" || header === "nama_pos")
      ) {
        if (header === "id_pos") {
          // Buat select dari Pos_Pembayaran
          let optionsHtml = `<option value="">-- Pilih ID Pos --</option>`;

          listPosPembayaran.forEach(function (pos) {
            const id = String(pos.id_pos || "").trim();
            const selected = String(value).trim() === id ? "selected" : "";
            optionsHtml += `<option value="${escapeHtml(id)}" ${selected}>${escapeHtml(id)}</option>`;
          });

          fieldHtml = `
          <div>
            <label class="text-xs font-semibold text-slate-600">
              id_pos <span class="text-rose-500">*</span>
            </label>
            <select
              id="master-field-id_pos"
              onchange="onMasterPosSelectedJS()"
              class="w-full mt-1 p-2.5 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none"
            >
              ${optionsHtml}
            </select>
          </div>
        `;
        } else if (header === "kode_pos" || header === "nama_pos") {
          // Readonly, akan diisi otomatis
          fieldHtml = `
          <div>
            <label class="text-xs font-semibold text-slate-600">
              ${escapeHtml(header)}
            </label>
            <input
              type="text"
              id="master-field-${header}"
              value=""
              readonly
              class="w-full mt-1 p-2.5 border rounded-lg text-sm bg-slate-100 text-slate-500 outline-none"
            />
          </div>
        `;
        }
      }
      // =====================================================
      // DROPDOWN BIASA (aktif, bisa_dicicil, tipe_nilai, dll)
      // =====================================================
      else if (hasSelect) {
        const options = SELECT_COLUMNS[header];
        let optionsHtml = options
          .map(function (opt) {
            const selected =
              String(value).toUpperCase() === String(opt).toUpperCase()
                ? "selected"
                : "";
            return `<option value="${escapeHtml(opt)}" ${selected}>${escapeHtml(opt)}</option>`;
          })
          .join("");

        fieldHtml = `
        <div>
          <label class="text-xs font-semibold text-slate-600">
            ${escapeHtml(header)}
            ${isPrimary ? '<span class="text-rose-500">*</span>' : ""}
          </label>
          <select
            id="master-field-${header}"
            class="w-full mt-1 p-2.5 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500 outline-none"
          >
            ${optionsHtml}
          </select>
        </div>
      `;
      }
      // =====================================================
      // INPUT BIASA
      // =====================================================
      else {
        fieldHtml = `
        <div>
          <label class="text-xs font-semibold text-slate-600">
            ${escapeHtml(header)}
            ${isPrimary ? '<span class="text-rose-500">*</span>' : ""}
          </label>
          <input
            type="${isNumber ? "number" : "text"}"
            id="master-field-${header}"
            value="${escapeHtml(String(value))}"
            ${isReadonly ? "readonly" : ""}
            class="w-full mt-1 p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none ${
              isReadonly ? "bg-slate-100 text-slate-500" : "bg-white"
            }"
          />
        </div>
      `;
      }

      form.innerHTML += fieldHtml;
    });

    document.getElementById("modal-master-form").classList.remove("hidden");
  }

  /**
   * Saat user memilih id_pos di form Master_Pos (mode tambah)
   */
  function onMasterPosSelectedJS() {
    const select = document.getElementById("master-field-id_pos");
    if (!select) return;

    const selectedId = (select.value || "").trim();

    const pos = listPosPembayaran.find(function (p) {
      return String(p.id_pos || "").trim() === selectedId;
    });

    const kodeInput = document.getElementById("master-field-kode_pos");
    const namaInput = document.getElementById("master-field-nama_pos");

    if (pos) {
      if (kodeInput) kodeInput.value = pos.kode_pos || "";
      if (namaInput) namaInput.value = pos.nama_pos || "";
    } else {
      if (kodeInput) kodeInput.value = "";
      if (namaInput) namaInput.value = "";
    }
  }

  function closeMasterFormJS() {
    document.getElementById("modal-master-form").classList.add("hidden");
    currentMasterEditRowIndex = null;
  }

  function saveMasterFormJS() {
    const payload = {};

    if (currentMasterEditRowIndex) {
      payload._rowIndex = currentMasterEditRowIndex;
    }

    let valid = true;

    currentMasterHeaders.forEach(function (header) {
      if (header === "_rowIndex") return;

      const el = document.getElementById("master-field-" + header);
      if (!el) return;

      let val = el.value;

      // Konversi TRUE/FALSE string menjadi boolean asli untuk sheet
      if (header === "aktif" || header === "bisa_dicicil") {
        payload[header] = String(val).toUpperCase() === "TRUE";
      } else {
        payload[header] = typeof val === "string" ? val.trim() : val;
      }

      // Validasi primary key
      if (header === currentMasterPrimaryKey && !payload[header]) {
        valid = false;
      }
    });

    if (!valid) {
      alert("Primary key (" + currentMasterPrimaryKey + ") wajib diisi.");
      return;
    }

    const btn = document.getElementById("btn-save-master");
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...`;

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.innerHTML = original;

        if (res && res.success) {
          closeMasterFormJS();
          loadMasterDataJS();
          alert(res.message);
        } else {
          alert(
            "Gagal: " +
              (res && res.message ? res.message : "Terjadi kesalahan."),
          );
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.innerHTML = original;
        alert("Terjadi kesalahan:\n" + err.message);
      })
      .saveMasterData(currentMasterSheet, payload);
  }

  function editMasterRowJS(rowIndex) {
    openMasterFormJS(rowIndex);
  }

  function deleteMasterRowJS(rowIndex) {
    showConfirmation(
      "Yakin ingin menghapus data ini?\nTindakan ini tidak dapat dibatalkan.",
    ).then(function (confirmed) {
      if (!confirmed) return;

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            loadMasterDataJS();
            alert(res.message);
          } else {
            alert(
              "Gagal: " +
                (res && res.message ? res.message : "Terjadi kesalahan."),
            );
          }
        })
        .withFailureHandler(function (err) {
          alert("Terjadi kesalahan:\n" + err.message);
        })
        .deleteMasterData(currentMasterSheet, rowIndex);
    });
  }

  function loadPosPembayaranForMasterJS(callback) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success && Array.isArray(res.data)) {
          listPosPembayaran = res.data;
        } else {
          listPosPembayaran = [];
        }
        if (typeof callback === "function") callback();
      })
      .withFailureHandler(function () {
        listPosPembayaran = [];
        if (typeof callback === "function") callback();
      })
      .getMasterData("Pos_Pembayaran");
  }

  /* ========================================================
   DATA SISWA
======================================================== */

  let listSiswaAll = [];
  let currentSiswaEditRowIndex = null;
  let listPotonganForSiswa = [];

  function loadSiswaJS() {
    const tbody = document.getElementById("table-siswa-body");
    tbody.innerHTML = `
    <tr>
      <td colspan="10" class="p-10 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-2 text-emerald-600"></i>
        <p class="text-sm">Memuat data siswa...</p>
      </td>
    </tr>
  `;

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) {
          tbody.innerHTML = `
          <tr>
            <td colspan="10" class="p-8 text-center text-rose-500">
              Gagal memuat data siswa.
            </td>
          </tr>
        `;
          return;
        }

        listSiswaAll = res.data || [];
        renderSiswaTableJS();
      })
      .withFailureHandler(function (err) {
        tbody.innerHTML = `
        <tr>
          <td colspan="10" class="p-8 text-center text-rose-500 font-semibold">
            Gagal: ${escapeHtml(err.message)}
          </td>
        </tr>
      `;
      })
      .getSiswaList();
  }

  function handleSiswaKeyup(e) {
    if (e.key === "Enter") {
      renderSiswaTableJS();
    }
  }

  function renderSiswaTableJS() {
    const tbody = document.getElementById("table-siswa-body");
    const keyword = (document.getElementById("siswa-keyword").value || "")
      .trim()
      .toLowerCase();

    let filtered = listSiswaAll;

    if (keyword) {
      filtered = listSiswaAll.filter(function (s) {
        const text = [
          s.id_siswa,
          s.nisn,
          s.nis,
          s.nama_lengkap,
          s.kelas,
          s.tahun_pelajaran,
          s.status_siswa,
          s.nama_potongan,
        ]
          .join(" ")
          .toLowerCase();
        return text.indexOf(keyword) !== -1;
      });
    }

    // Summary
    const total = listSiswaAll.length;
    const aktif = listSiswaAll.filter(function (s) {
      return String(s.status_siswa).toUpperCase() === "AKTIF";
    }).length;

    document.getElementById("siswa-total").innerText = total;
    document.getElementById("siswa-aktif").innerText = aktif;
    document.getElementById("siswa-ditampilkan").innerText = filtered.length;

    if (!filtered.length) {
      tbody.innerHTML = `
      <tr>
        <td colspan="10" class="p-10 text-center text-slate-400">
          <i class="fa-solid fa-user-slash text-3xl mb-2"></i>
          <p class="text-sm">Tidak ada data siswa ditemukan.</p>
        </td>
      </tr>
    `;
      return;
    }

    let html = "";

    filtered.forEach(function (s) {
      const statusClass =
        String(s.status_siswa).toUpperCase() === "AKTIF"
          ? "bg-emerald-100 text-emerald-700"
          : "bg-slate-200 text-slate-600";

      html += `
      <tr class="hover:bg-slate-50 transition">
        <td class="p-3 font-semibold text-emerald-700 text-sm">${escapeHtml(s.id_siswa)}</td>
        <td class="p-3 text-sm">${escapeHtml(s.nisn || "-")}</td>
        <td class="p-3 text-sm">${escapeHtml(s.nis || "-")}</td>
        <td class="p-3">
          <div class="font-bold text-slate-800">${escapeHtml(s.nama_lengkap)}</div>
        </td>
        <td class="p-3 text-sm">${escapeHtml(s.jenis_kelamin || "-")}</td>
        <td class="p-3">
          <span class="px-2 py-1 rounded-full bg-indigo-100 text-indigo-700 text-xs font-bold">
            ${escapeHtml(s.kelas || "-")}
          </span>
        </td>
        <td class="p-3 text-sm">${escapeHtml(s.tahun_pelajaran || "-")}</td>
        <td class="p-3">
          <span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-bold ${statusClass}">
            ${escapeHtml(s.status_siswa || "-")}
          </span>
        </td>
        <td class="p-3 text-sm text-slate-600">${escapeHtml(s.nama_potongan || "-")}</td>
        <td class="p-3 text-center whitespace-nowrap">
          <button
            onclick="editSiswaJS(${s._rowIndex})"
            class="w-8 h-8 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-600 transition mr-1"
            title="Edit"
          >
            <i class="fa-solid fa-pen text-xs"></i>
          </button>
          <button
            onclick="deleteSiswaJS(${s._rowIndex})"
            class="w-8 h-8 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 transition"
            title="Hapus"
          >
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
        </td>
      </tr>
    `;
    });

    tbody.innerHTML = html;
  }

  /* ========== FORM SISWA ========== */

  function openSiswaFormJS(rowIndex) {
    currentSiswaEditRowIndex = rowIndex || null;
    const isEdit = !!rowIndex;

    document.getElementById("siswa-form-title").innerText = isEdit
      ? "Edit Siswa"
      : "Tambah Siswa";

    // Ambil daftar potongan dulu
    google.script.run
      .withSuccessHandler(function (res) {
        listPotonganForSiswa = res && res.data ? res.data : [];
        buildSiswaFormFields(isEdit, rowIndex);
      })
      .withFailureHandler(function () {
        listPotonganForSiswa = [];
        buildSiswaFormFields(isEdit, rowIndex);
      })
      .getMasterData("Master_Potongan");
  }

  function buildSiswaFormFields(isEdit, rowIndex) {
    const form = document.getElementById("siswa-form");
    form.innerHTML = "";

    let editData = {};
    if (isEdit) {
      editData =
        listSiswaAll.find(function (s) {
          return Number(s._rowIndex) === Number(rowIndex);
        }) || {};
    }

    const fields = [
      { key: "id_siswa", label: "ID Siswa", required: true, readonly: isEdit },
      { key: "nisn", label: "NISN" },
      { key: "nis", label: "NIS" },
      { key: "nama_lengkap", label: "Nama Lengkap", required: true },
      {
        key: "jenis_kelamin",
        label: "Jenis Kelamin",
        type: "select",
        options: ["L", "P"],
      },
      { key: "kelas", label: "Kelas" },
      { key: "tahun_pelajaran", label: "Tahun Pelajaran" },
      {
        key: "status_siswa",
        label: "Status",
        type: "select",
        options: ["AKTIF", "NONAKTIF", "LULUS", "PINDAH"],
      },
      {
        key: "id_potongan_default",
        label: "Potongan Default",
        type: "select-potongan",
      },
    ];

    fields.forEach(function (f) {
      const value =
        editData[f.key] !== undefined && editData[f.key] !== null
          ? editData[f.key]
          : "";

      let fieldHtml = "";

      if (f.type === "select") {
        let optionsHtml = f.options
          .map(function (opt) {
            const selected =

  function saveSiswaJS() {
    const payload = {};

    if (currentSiswaEditRowIndex) {
      payload._rowIndex = currentSiswaEditRowIndex;
    }

    const keys = [
      "id_siswa",
      "nisn",
      "nis",
      "nama_lengkap",
      "jenis_kelamin",
      "kelas",
      "tahun_pelajaran",
      "status_siswa",
      "id_potongan_default",
    ];

    keys.forEach(function (key) {
      const el = document.getElementById("siswa-field-" + key);
      payload[key] = el ? el.value.trim() : "";
    });

    if (!payload.id_siswa) {
      alert("ID Siswa wajib diisi.");
      return;
    }
    if (!payload.nama_lengkap) {
      alert("Nama Lengkap wajib diisi.");
      return;
    }

    const btn = document.getElementById("btn-save-siswa");
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...`;

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.innerHTML = original;

        if (res && res.success) {
          closeSiswaFormJS();
          loadSiswaJS();
          alert(res.message);
        } else {
          alert(

              (res && res.message ? res.message : "Terjadi kesalahan."),
          );
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.innerHTML = original;
        alert("Terjadi kesalahan:\n" + err.message);
      })
      .saveSiswa(payload);
