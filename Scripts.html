  function prosesImportSiswaFileJS() {
    const fileInput = document.getElementById("import-siswa-file");
    const file = fileInput.files[0];

    if (!file) {
      alert("Silakan pilih file Excel terlebih dahulu.");
      return;
    }

    const btn = document.getElementById("btn-proses-import-siswa");
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Membaca file...`;

    const reader = new FileReader();

    reader.onload = function (e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        // Ambil sheet pertama
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];

        // Convert ke JSON (header di baris pertama)
        const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        if (!jsonData || jsonData.length === 0) {
          alert("File Excel kosong atau tidak ada data.");
          btn.disabled = false;
          btn.innerHTML = original;
          return;
        }

        // Normalisasi nama kolom jadi huruf kecil
        const dataArray = jsonData.map(function (row) {
          const obj = {};
          Object.keys(row).forEach(function (key) {
            const cleanKey = String(key).trim().toLowerCase();
            obj[cleanKey] = row[key];
          });

          // Alias umum
          if (!obj.status_siswa && obj.status) obj.status_siswa = obj.status;

          return obj;
        });

        // Validasi id_siswa
        const hasId = dataArray.some(function (r) {
          return r.id_siswa && String(r.id_siswa).trim() !== "";
        });

        if (!hasId) {
          alert("Kolom id_siswa tidak ditemukan atau semuanya kosong.");
          btn.disabled = false;
          btn.innerHTML = original;
          return;
        }

        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Mengirim data...`;

        // Kirim ke server
        google.script.run
          .withSuccessHandler(function (res) {
            btn.disabled = false;
            btn.innerHTML = original;

            if (res && res.success) {
              closeImportSiswaJS();
              loadSiswaJS();
              alert(res.message);
            } else {
              alert(
                "Gagal import: " +
                  (res && res.message ? res.message : "Terjadi kesalahan."),
              );
            }
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            btn.innerHTML = original;
            alert("Terjadi kesalahan:\n" + err.message);
          })
          .importSiswa(dataArray);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = original;
        alert("Gagal membaca file Excel:\n" + err.message);
      }
    };

    reader.onerror = function () {
      btn.disabled = false;
      btn.innerHTML = original;
      alert("Gagal membaca file.");
    };

    reader.readAsArrayBuffer(file);
  }

      window._kelasLoaded = true;

}

  /**
   * Riwayat Setting Tagihan dikelompokkan per Kelas + Pos + Periode
   * (join ke sheet Siswa untuk mendapatkan Kelas)
   */
  //Legacy server implementation moved to code.gs.
  function getRiwayatSettingKelas(page, perPage) {
    page = page || 1;
    perPage = perPage || 10;

    try {
      const ss = SpreadsheetApp.getActiveSpreadsheet();

      // ===== 1. Sheet Tagihan =====
      let sheetTagihan =
        ss.getSheetByName("Tagihan_Siswa") ||
        ss.getSheetByName("Tagihan") ||
        ss.getSheetByName("tagihan") ||
        ss.getSheetByName("TAGIHAN");

      if (!sheetTagihan) {
        const sheets = ss.getSheets();
        for (let i = 0; i < sheets.length; i++) {
          if (sheets[i].getName().toLowerCase().indexOf("tagihan") !== -1) {
            sheetTagihan = sheets[i];
            break;
          }
        }
      }

      if (!sheetTagihan) {
        return {
          data: [],
          total: 0,
          page: 1,
          error: "Sheet Tagihan tidak ditemukan",
        };
      }

      const dataTagihan = sheetTagihan.getDataRange().getValues();
      if (dataTagihan.length <= 1) {
        return { data: [], total: 0, page: 1, error: "Sheet Tagihan kosong" };
      }

      const headersT = dataTagihan[0].map(function (h) {
        return String(h || "")
          .toLowerCase()
          .trim();
      });

      function findCol(headers, names) {
        for (let i = 0; i < names.length; i++) {
          const idx = headers.indexOf(names[i]);
          if (idx !== -1) return idx;
        }
        for (let i = 0; i < headers.length; i++) {
          for (let j = 0; j < names.length; j++) {
            if (headers[i].indexOf(names[j]) !== -1) return i;
          }
        }
        return -1;
      }

      const col = {
        idSiswa: findCol(headersT, ["id_siswa", "idsiswa", "id siswa"]),
        idPos: findCol(headersT, ["id_pos", "idpos", "id pos"]),
        periode: findCol(headersT, ["periode"]),
        namaItem: findCol(headersT, [
          "nama_item_snapshot",
          "nama item",
          "nama_item",
          "nama pos",
        ]),
        nominal: findCol(headersT, [
          "nominal_akhir",
          "nominal_asal",
          "nominal",
        ]),
        tanggal: findCol(headersT, ["tanggal_tagihan", "tanggal", "tgl"]),
        status: findCol(headersT, ["status", "status_siswa"]),
      };

      if (col.idSiswa === -1) {
        return {
          data: [],
          total: 0,
          page: 1,
          error:
            "Kolom id_siswa tidak ditemukan. Header: [" +
            headersT.join(" | ") +
            "]",
        };
      }

      // ===== 2. Sheet Siswa → map id_siswa → kelas =====
      let sheetSiswa =
        ss.getSheetByName("Siswa") ||
        ss.getSheetByName("siswa") ||
        ss.getSheetByName("SISWA") ||
        ss.getSheetByName("Data Siswa");

      if (!sheetSiswa) {
        const sheets = ss.getSheets();
        for (let i = 0; i < sheets.length; i++) {
          const n = sheets[i].getName().toLowerCase();
          if (n.indexOf("siswa") !== -1 && n.indexOf("tagihan") === -1) {
            sheetSiswa = sheets[i];
            break;
          }
        }
      }

      const mapSiswaKelas = {}; // id_siswa → kelas

      if (sheetSiswa) {
        const dataSiswa = sheetSiswa.getDataRange().getValues();
        if (dataSiswa.length > 1) {
          const headersS = dataSiswa[0].map(function (h) {
            return String(h || "")
              .toLowerCase()
              .trim();
          });

          const colSiswaId = findCol(headersS, [
            "id_siswa",
            "id",
            "idsiswa",
            "nis",
            "nisn",
          ]);
          const colSiswaKelas = findCol(headersS, [
            "kelas",
            "nama_kelas",
            "class",
            "kelas_saat_ini",
          ]);

          if (colSiswaId !== -1 && colSiswaKelas !== -1) {
            for (let i = 1; i < dataSiswa.length; i++) {
              const id = String(dataSiswa[i][colSiswaId] || "").trim();
              const kelas = String(dataSiswa[i][colSiswaKelas] || "").trim();
              if (id) mapSiswaKelas[id] = kelas || "-";
            }
          }
        }
      }

      // ===== 3. (Opsional) Sheet Pos → map id_pos → nama =====
      const mapPosNama = {};
      let sheetPos =
        ss.getSheetByName("Pos") ||
        ss.getSheetByName("pos") ||
        ss.getSheetByName("Pos Pembayaran") ||
        ss.getSheetByName("pos_pembayaran");

      if (sheetPos) {
        const dataPos = sheetPos.getDataRange().getValues();
        if (dataPos.length > 1) {
          const headersP = dataPos[0].map(function (h) {
            return String(h || "")
              .toLowerCase()
              .trim();
          });
          const colPosId = findCol(headersP, ["id_pos", "id", "idpos"]);
          const colPosNama = findCol(headersP, [
            "nama",
            "nama_pos",
            "nama pos",
            "pos",
          ]);

          if (colPosId !== -1 && colPosNama !== -1) {
            for (let i = 1; i < dataPos.length; i++) {
              const id = String(dataPos[i][colPosId] || "").trim();
              const nama = String(dataPos[i][colPosNama] || "").trim();
              if (id) mapPosNama[id] = nama || id;
            }
          }
        }
      }

      // ===== 4. Agregasi =====
      const groupMap = {};

      for (let i = 1; i < dataTagihan.length; i++) {
        const row = dataTagihan[i];

        const idSiswa = String(row[col.idSiswa] || "").trim();
        if (!idSiswa) continue;

        // Ambil kelas dari map Siswa
        const kelas = mapSiswaKelas[idSiswa] || "Tidak diketahui";

        // Nama Pos: prioritaskan nama_item_snapshot, fallback ke mapPos
        let posNama = "-";
        if (col.namaItem !== -1 && row[col.namaItem]) {
          posNama = String(row[col.namaItem]).trim();
        } else if (col.idPos !== -1) {
          const idPos = String(row[col.idPos] || "").trim();
          posNama = mapPosNama[idPos] || idPos || "-";
        }

        const periode =
          col.periode !== -1 ? String(row[col.periode] || "").trim() : "-";

        // Tanggal
        let tanggalStr = "-";
        let tanggalBatch = "";
        if (col.tanggal !== -1 && row[col.tanggal]) {
          const t = row[col.tanggal];
          if (
            Object.prototype.toString.call(t) === "[object Date]" &&
            !isNaN(t.getTime())
          ) {
            tanggalStr = Utilities.formatDate(
              t,
              Session.getScriptTimeZone(),
              "dd/MM/yyyy",
            );
            tanggalBatch = Utilities.formatDate(
              t,
              Session.getScriptTimeZone(),
              "yyyy-MM-dd",
            );
          } else {
            tanggalStr = String(t);
            tanggalBatch = tanggalStr;
          }
        }

        // Key grouping
        const key = kelas + "|" + posNama + "|" + periode + "|" + tanggalBatch;

        if (!groupMap[key]) {
          groupMap[key] = {
            tanggal: tanggalStr,
            tanggalBatch: tanggalBatch,
            kelas: kelas,
            pos: posNama,
            periode: periode,
            jumlahSiswa: 0,
            nominal: 0,
            totalTagihan: 0,
            statusCount: { lunas: 0, sebagian: 0, belum: 0 },
            status: "Belum Lunas",
          };
        }

        const g = groupMap[key];
        g.jumlahSiswa += 1;

        const nominal = col.nominal !== -1 ? Number(row[col.nominal]) || 0 : 0;
        if (g.nominal === 0 && nominal > 0) g.nominal = nominal;
        g.totalTagihan += nominal;

        // Status
        if (col.status !== -1) {
          const st = String(row[col.status] || "").toLowerCase();
          if (st.indexOf("lunas") !== -1 || st === "paid") {
            g.statusCount.lunas += 1;
          } else if (
            st.indexOf("sebagian") !== -1 ||
            st === "partial" ||
            st.indexOf("cicil") !== -1
          ) {
            g.statusCount.sebagian += 1;
          } else {
            g.statusCount.belum += 1;
          }
        } else {
          g.statusCount.belum += 1;
        }
      }

      // Status final
      const list = [];
      for (const key in groupMap) {
        const g = groupMap[key];
        if (g.jumlahSiswa > 0 && g.statusCount.lunas === g.jumlahSiswa) {
          g.status = "Lunas";
        } else if (g.statusCount.lunas > 0 || g.statusCount.sebagian > 0) {
          g.status = "Sebagian";
        } else {
          g.status = "Belum Lunas";
        }
        list.push(g);
      }

      // Urutkan terbaru
      list.sort(function (a, b) {
        if (a.tanggalBatch && b.tanggalBatch) {
          return b.tanggalBatch.localeCompare(a.tanggalBatch);
        }
        return 0;
      });

      const total = list.length;
      const start = (page - 1) * perPage;
      const paged = list.slice(start, start + perPage);

      // Cek apakah map siswa berhasil
      const jumlahMapSiswa = Object.keys(mapSiswaKelas).length;

      return {
        data: paged,
        total: total,
        page: page,
        _debug: {
          sheetTagihan: sheetTagihan.getName(),
          sheetSiswa: sheetSiswa ? sheetSiswa.getName() : "TIDAK DITEMUKAN",
          jumlahMapSiswa: jumlahMapSiswa,
          totalGroup: total,
          sampleKelas: list.length > 0 ? list[0].kelas : null,
        },
      };
    } catch (err) {
      return {
        data: [],
        total: 0,
        page: 1,
        error: err.message,
      };
    }
  }

  // ===== Helper pagination (aman untuk onclick HTML) =====
  function goRiwayatSiswaPrev() {
    var page =
      (typeof currentPageSetting !== "undefined" ? currentPageSetting : 1) - 1;
    loadRiwayatSettingTagihanJS(page);
  }

  function goRiwayatSiswaNext() {
    var page =
      (typeof currentPageSetting !== "undefined" ? currentPageSetting : 1) + 1;
    loadRiwayatSettingTagihanJS(page);
  }

  function goRiwayatKelasPrev() {
    var page =
      (typeof currentPageSettingKelas !== "undefined"
        ? currentPageSettingKelas
        : 1) - 1;
    loadRiwayatSettingKelasJS(page);
  }

  function goRiwayatKelasNext() {
    var page =
      (typeof currentPageSettingKelas !== "undefined"
        ? currentPageSettingKelas
        : 1) + 1;
    loadRiwayatSettingKelasJS(page);
  }

  function showHapusProgressModal(total) {
    var modal = document.getElementById("modal-hapus-progress");
    if (!modal) return;

    modal.classList.remove("hidden");
    modal.classList.add("flex");

    updateHapusProgress(0, total, "Memulai penghapusan...");
  }

  function hideHapusProgressModal() {
    var modal = document.getElementById("modal-hapus-progress");
    if (!modal) return;
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  }

  function updateHapusProgress(done, total, statusText) {
    total = total || 0;
    done = done || 0;
    var pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;

    var bar = document.getElementById("hapus-progress-bar");
    var label = document.getElementById("hapus-progress-label");
    var count = document.getElementById("hapus-progress-count");
    var status = document.getElementById("hapus-progress-status");
    var subtitle = document.getElementById("hapus-progress-subtitle");

    if (bar) bar.style.width = pct + "%";
    if (label) label.textContent = pct + "%";
    if (count) count.textContent = done + " / " + total;
    if (status && statusText) status.textContent = statusText;
    if (subtitle)
      subtitle.textContent =
        total > 0 ? "Menghapus " + total + " tagihan" : "Memproses...";
  }

  function hapusSettingKelasJS(
    kelasEnc,
    posEnc,
    periodeEnc,
    tanggalBatch,
    jumlahSiswa,
  ) {
    var kelas = decodeURIComponent(kelasEnc || "");
    var pos = decodeURIComponent(posEnc || "");
    var periode = decodeURIComponent(periodeEnc || "");
    jumlahSiswa = Number(jumlahSiswa) || 0;

    var pesan =
      "Hapus setting tagihan ini?\n\n" +
      "Kelas   : " +
      kelas +
      "\n" +
      "Pos     : " +
      pos +
      "\n" +
      "Periode : " +
      periode +
      "\n" +
      "Tanggal : " +
      (tanggalBatch || "-") +
      "\n" +
      "Jumlah  : " +
      jumlahSiswa +
      " siswa\n\n" +
      "Catatan: tagihan yang sudah ada pembayaran TIDAK akan dihapus.\n" +
      "Lanjutkan?";

    showConfirmation(pesan).then(function (confirmed) {
      if (!confirmed) return;

      showHapusProgressModal(jumlahSiswa);

      var BATCH_SIZE = 20;
      var totalDeleted = 0;
      var totalSkipped = 0;
      var totalTarget = jumlahSiswa;
      var finished = false;

      function jalankanBatch() {
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result || !result.success) {
              hideHapusProgressModal();
              alert(
                "Gagal menghapus: " +
                  ((result && result.message) || "Unknown error"),
              );
              return;
            }

            totalDeleted += result.deleted || 0;
            if (result.skipped) totalSkipped = result.skipped; // total skipped dihitung penuh tiap batch

            var remaining = result.remaining || 0;

            if (result.totalDeletable && result.totalDeletable > 0) {
              totalTarget = result.totalDeletable + (result.skipped || 0);
            }

            var done = totalDeleted + totalSkipped;
            if (result.totalMatched) {
              done = Math.min(result.totalMatched, totalDeleted + totalSkipped);
              totalTarget = result.totalMatched;
            }

            updateHapusProgress(
              Math.min(done, totalTarget),
              totalTarget,
              remaining > 0
                ? "Menghapus... sisa " + remaining + " data belum dibayar"
                : "Menyelesaikan...",
            );

            // Tidak ada yang bisa dihapus sama sekali
            if (
              totalDeleted === 0 &&
              remaining === 0 &&
              (result.deleted || 0) === 0
            ) {
              if (finished) return;
              finished = true;
              updateHapusProgress(totalTarget, totalTarget, "Selesai");
              setTimeout(function () {
                hideHapusProgressModal();
                if (totalSkipped > 0) {
                  alert(
                    "Tidak ada tagihan yang dihapus.\n\n" +
                      totalSkipped +
                      " tagihan dilindungi karena sudah ada pembayaran.",
                  );
                } else {
                  alert(result.message || "Tidak ada data yang dihapus.");
                }
                loadRiwayatSettingKelasJS(currentPageSettingKelas || 1);
              }, 400);
              return;
            }

            if (remaining > 0 && (result.deleted || 0) > 0) {
              jalankanBatch();
            } else {
              if (finished) return;
              finished = true;
              updateHapusProgress(totalTarget, totalTarget, "Selesai!");
              setTimeout(function () {
                hideHapusProgressModal();
                var msg = "Berhasil menghapus " + totalDeleted + " tagihan.";
                if (totalSkipped > 0) {
                  msg +=
                    "\n" +
                    totalSkipped +
                    " tagihan tidak dihapus karena sudah ada pembayaran.";
                }
                alert(msg);
                loadRiwayatSettingKelasJS(currentPageSettingKelas || 1);
              }, 400);
            }
          })
          .withFailureHandler(function (err) {
            hideHapusProgressModal();
            alert("Gagal menghapus: " + (err.message || err));
          })
          .hapusSettingKelasBatch(
            kelas,
            pos,
            periode,
            tanggalBatch,
            BATCH_SIZE,
          );
      }

      jalankanBatch();
    });
  }

window.prosesCetakDanSimpanPDF = function() {
  const getText = (id) => {
    const el = document.getElementById(id);
    return el ? el.innerText.trim() : "";
  };

  let payload = {};

  // LAPIS 1: Ambil dari objek JS jika tersedia (dari Riwayat Transaksi)
  if (typeof detailTransaksiAktif !== 'undefined' && detailTransaksiAktif && detailTransaksiAktif.transaksi) {
    const trx = detailTransaksiAktif.transaksi;
    const detail = detailTransaksiAktif.detail || [];

    payload = {
      noKuitansi: trx.no_kuitansi || "-",
      tanggal: trx.tanggal || "-",
      kasir: trx.nama_kasir || "Admin Kasir",
      namaSiswa: trx.nama_siswa || "-",
      nisn: trx.nisn || "-",
      kelas: trx.kelas || "-",
      items: detail.map(function(item) {
        return {
          nama_item: item.nama_item || "-",
          diskon_tambahan: Number(item.diskon_tambahan) || 0,
          nominal_dibayar: Number(item.nominal_dibayar) || 0
        };
      }),
      total: Number(trx.total_bayar) || 0,
      metode: typeof getLabelMetodePembayaran === 'function' ? getLabelMetodePembayaran(trx.metode_pembayaran) : (trx.metode_pembayaran || "-"),
      catatan: trx.catatan || ""
    };
  } 
  // LAPIS 2 (FALLBACK): Ambil langsung dari elemen DOM Modal Kuitansi (dari Kasir/Transaksi Baru)
  else {
    const itemsContainer = document.getElementById("kw-items-list");
    let itemsList = [];

    if (itemsContainer) {
      const itemRows = itemsContainer.querySelectorAll('.flex.justify-between');
      itemRows.forEach(row => {
        const nameEl = row.querySelector('.font-bold');
        const priceEl = row.querySelector('.text-right');
        if (nameEl && priceEl) {
          itemsList.push({
            nama_item: nameEl.innerText.trim(),
            diskon_tambahan: 0,
            nominal_dibayar: Number(priceEl.innerText.replace(/[^0-9]/g, '')) || 0
          });
        }
      });
    }

    // Pemisahan NISN dan Kelas dari format "NISN / Kelas X"
    const nisnKelasRaw = getText("kw-siswa-nisn");
    const parts = nisnKelasRaw.split("/");
    const nisnVal = parts[0] ? parts[0].trim() : "-";
    const kelasVal = parts[1] ? parts[1].replace(/Kelas/i, '').trim() : "-";

    payload = {
      noKuitansi: getText("kw-no") || "-",
      tanggal: getText("kw-tgl") || "-",
      kasir: getText("kw-kasir") || "Admin Kasir",
      namaSiswa: getText("kw-siswa-nama") || "-",
      nisn: nisnVal,
      kelas: kelasVal,
      items: itemsList.length > 0 ? itemsList : [{
        nama_item: "Pembayaran Keuangan",
        diskon_tambahan: 0,
        nominal_dibayar: Number(getText("kw-total").replace(/[^0-9]/g, '')) || 0
      }],
      total: Number(getText("kw-total").replace(/[^0-9]/g, '')) || 0,
      metode: getText("kw-metode") || "-",
      catatan: getText("kw-catatan") || ""
    };
  }

  // Validasi keamanan: Pastikan nomor kuitansi terisi
  if (!payload.noKuitansi || payload.noKuitansi === "-") {
    alert("Data kuitansi belum dimuat dengan sempurna.");
    return;
  }

  // Tampilkan Indikator Loading
  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: 'Memproses Nota...',
      text: 'Membuat PDF & Mencatat ke Sheet',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });
  }

  // Kirim ke Backend Google Apps Script
  google.script.run
    .withSuccessHandler(function(res) {
      if (typeof Swal !== 'undefined') Swal.close();
      if (res && res.pdfUrl) {
        window.open(res.pdfUrl, '_blank');
        window.print();
      }
    })
    .withFailureHandler(function(err) {
      const msg = err.message || err;
      if (typeof Swal !== 'undefined') {
        Swal.fire('Gagal!', 'Terjadi kesalahan: ' + msg, 'error');
      } else {
        alert('Gagal: ' + msg);
      }
    })
    .simpanLogCetakNota(payload);
};

    // Tampilkan badge warning jika ada yang sudah dibayar

function getStatusBadgeClass(status) {
  var s = (status || '').toUpperCase();
  if (s === 'LUNAS') return 'bg-emerald-100 text-emerald-700';
  if (s === 'CICILAN' || s === 'SEBAGIAN') return 'bg-amber-100 text-amber-700';
  return 'bg-red-100 text-red-700';
}

function showLoading(message) {
  var modal = document.getElementById('modal-generate-progress');

    document.getElementById('generate-progress-subtitle').textContent = message || 'Memproses...';
    document.getElementById('generate-progress-bar').style.width = '50%';
    document.getElementById('generate-progress-status').textContent = 'Memproses...';
    modal.classList.remove('hidden');
    modal.classList.add('flex');

function loadSearchFilters() {
  google.script.run
    .withSuccessHandler(function(posList) {
      var selectKelasPos = document.getElementById('search-kelas-pos');
      if (selectKelasPos) {
        while (selectKelasPos.options.length > 1) {
          selectKelasPos.remove(1);
        }
        posList.forEach(function(pos) {
          var opt = document.createElement('option');
          opt.value = pos.id_pos;
          opt.text = pos.nama_pos;
          selectKelasPos.appendChild(opt);
        });
      }
      
      var selectSiswaPos = document.getElementById('search-siswa-pos');
      if (selectSiswaPos) {
        while (selectSiswaPos.options.length > 1) {
          selectSiswaPos.remove(1);
        }
        posList.forEach(function(pos) {
          var opt = document.createElement('option');
          opt.value = pos.id_pos;
          opt.text = pos.nama_pos;
          selectSiswaPos.appendChild(opt);
        });
      }
    })
    .withFailureHandler(function(err) {
      console.error('Gagal load pos: ' + err.message);
    })
    .getPosForTagihanFilter();
  
  google.script.run
    .withSuccessHandler(function(kelasList) {
      var select = document.getElementById('search-siswa-kelas');
      if (select) {
        while (select.options.length > 1) {
          select.remove(1);
        }
        kelasList.forEach(function(kelas) {
          var opt = document.createElement('option');
          opt.value = kelas;
          opt.text = kelas;
          select.appendChild(opt);
        });
      }
    })
    .withFailureHandler(function(err) {
      console.error('Gagal load kelas: ' + err.message);
    })
    .getListKelas();
}

function switchRiwayatSettingTab(tab) {

  var panelKelas = document.getElementById('riwayat-tab-kelas');

  if (tab === 'kelas') {
    tabKelas.className = 'flex-1 sm:flex-none px-5 py-3.5 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50/50 transition';
    tabSiswa.className = 'flex-1 sm:flex-none px-5 py-3.5 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-50 transition';
    panelKelas.classList.remove('hidden');
    panelSiswa.classList.add('hidden');
    
    if (window._needRefreshKelas || !window._kelasLoaded) {
      window._kelasLoaded = true;
      window._needRefreshKelas = false;
      searchRiwayatKelas(1);
    } else {
      searchRiwayatKelas(riwayatKelasPage || 1);
    }
  } else {
    tabSiswa.className = 'flex-1 sm:flex-none px-5 py-3.5 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50/50 transition';
    tabKelas.className = 'flex-1 sm:flex-none px-5 py-3.5 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-50 transition';
    panelSiswa.classList.remove('hidden');
    panelKelas.classList.add('hidden');
    
    if (window._needRefreshSiswa || !window._siswaLoaded) {
      window._siswaLoaded = true;
      window._needRefreshSiswa = false;
      searchRiwayatSiswa(1);
    } else {
      searchRiwayatSiswa(riwayatSiswaPage || 1);
    }
  }
}

function hapusSettingKelas(kelas, pos, periode, tanggalBatch) {
  // Cek terlebih dahulu apakah ada tagihan yang sudah dibayar
  showLoading('Memeriksa data tagihan...');
  
  // Panggil fungsi backend untuk cek terlebih dahulu
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      
      // Jika ada yang sudah dibayar, tampilkan peringatan
      if (result.skipped && result.skipped > 0) {
        Swal.fire({
          icon: 'error',
          title: 'Tidak Dapat Dihapus!',
          html: `
            <div style="text-align: left; padding: 10px 0;">
              <p style="color: #dc2626; font-weight: bold;">⚠️ Setting tagihan ini tidak dapat dihapus!</p>
              <p>Terdapat <strong>${result.skipped}</strong> tagihan yang sudah memiliki pembayaran (LUNAS/CICILAN).</p>
              <p style="font-size: 12px; color: #64748b; margin-top: 10px;">
                Tagihan yang sudah dibayar tidak dapat dihapus untuk menjaga integritas data keuangan.
              </p>
              <hr style="margin: 10px 0; border-color: #e2e8f0;">
              <p style="font-size: 12px; color: #64748b;">
                Total tagihan dalam group ini: <strong>${result.totalMatched || 0}</strong>
              </p>
            </div>
          `,
          confirmButtonColor: '#dc2626',
          confirmButtonText: 'OK'
        });
        return;
      }
      
      // Jika tidak ada yang dibayar, lanjutkan konfirmasi hapus
      Swal.fire({
        title: 'Hapus Tagihan?',
        html: `
          <div style="text-align: left; padding: 10px 0;">
            <p>Anda akan menghapus <strong>SEMUA</strong> tagihan dengan:</p>
            <p><strong>Kelas:</strong> ${kelas}</p>
            <p><strong>Pos:</strong> ${pos}</p>
            <p><strong>Periode:</strong> ${periode}</p>
            <p><strong>Tanggal:</strong> ${tanggalBatch || '-'}</p>
            <p style="color: #10b981; font-weight: bold; margin-top: 10px;">
              ✅ ${result.deleted || 0} tagihan akan dihapus (semua belum dibayar)
            </p>
          </div>
          <p style="color: #dc2626; font-weight: bold; margin-top: 10px;">⚠️ Tindakan ini tidak dapat dibatalkan!</p>
        `,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc2626',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Hapus!',
        cancelButtonText: 'Batal'
      }).then(function(result) {
        if (result.isConfirmed) {
          // Jalankan hapus sebenarnya
          showLoading('Menghapus data...');
          
          google.script.run
            .withSuccessHandler(function(result) {
              hideLoading();
              if (result.success) {
                Swal.fire({
                  icon: 'success',
                  title: 'Berhasil!',
                  text: 'Berhasil menghapus ' + result.deleted + ' tagihan.',
                  confirmButtonColor: '#10b981'
                });
                searchRiwayatKelas(riwayatKelasPage);
              } else {
                Swal.fire({
                  icon: 'error',
                  title: 'Gagal Hapus',
                  text: result.message,
                  confirmButtonColor: '#dc2626'
                });
              }
            })
            .withFailureHandler(function(err) {
              hideLoading();
              Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Terjadi kesalahan: ' + err.message,
                confirmButtonColor: '#dc2626'
              });
            })
            .hapusSettingKelas(kelas, pos, periode, tanggalBatch);
        }
      });
    })
    .withFailureHandler(function(err) {
      hideLoading();
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'Terjadi kesalahan: ' + err.message,
        confirmButtonColor: '#dc2626'
      });
    })
    .hapusSettingKelas(kelas, pos, periode, tanggalBatch);
}

function hapusTagihanSiswa(idTagihan) {

}

function showDetailByKelas(kelas, pos, periode, tanggalBatch, idPos) {
  var selectKelas = document.getElementById('search-siswa-kelas');
  var selectPos = document.getElementById('search-siswa-pos');
  var inputKeyword = document.getElementById('search-siswa-keyword');
  var selectStatus = document.getElementById('search-siswa-status');
  
  if (selectKelas) {
    for (var i = 0; i < selectKelas.options.length; i++) {
      if (selectKelas.options[i].value === kelas) {
        selectKelas.value = kelas;
        break;
      }
    }
  }
  
  if (selectPos && idPos) {
    var found = false;
    for (var i = 0; i < selectPos.options.length; i++) {
      if (selectPos.options[i].value === idPos) {
        selectPos.value = idPos;
        found = true;
        break;
      }
    }
    if (!found && pos) {
      for (var i = 0; i < selectPos.options.length; i++) {
        var optionText = selectPos.options[i].text.toLowerCase();
        var posLower = pos.toLowerCase();
        if (optionText.indexOf(posLower) !== -1 || posLower.indexOf(optionText) !== -1) {
          selectPos.value = selectPos.options[i].value;
          found = true;
          break;
        }
      }
    }
    if (!found) {
      selectPos.value = 'ALL';
    }
  }
  
  if (inputKeyword) {
    inputKeyword.value = '';
  }
  if (selectStatus) {
    selectStatus.value = 'ALL';
  }
  
  Swal.fire({
    title: 'Memuat Detail Siswa',
    text: 'Mengambil data siswa untuk kelas ' + kelas + '...',
    icon: 'info',
    allowOutsideClick: false,
    didOpen: function() {
      Swal.showLoading();
    }
  });
  
  switchRiwayatSettingTab('siswa');
  riwayatSiswaPage = 1;
  
  var container = document.getElementById('table-riwayat-setting-body');
  container.innerHTML = `
    <tr>
      <td colspan="8" class="p-10 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-2 text-emerald-600"></i>
        <p class="text-sm">Memuat data siswa untuk kelas ${kelas}...</p>
      </td>
    </tr>
  `;
  
  var keyword = document.getElementById('search-siswa-keyword').value;
  var filterKelas = document.getElementById('search-siswa-kelas').value;
  var filterPos = document.getElementById('search-siswa-pos').value;
  var filterStatus = document.getElementById('search-siswa-status').value;
  
  window._siswaLoaded = true;
  
  google.script.run
    .withSuccessHandler(function(result) {
      Swal.close();
      if (result.success) {
        riwayatSiswaTotalPages = result.total_pages || 1;
        riwayatSiswaTotalData = result.total || 0;
        renderRiwayatSiswa(result);
        
        if (result.data && result.data.length > 0) {
          Swal.fire({
            icon: 'success',
            title: 'Data Ditemukan!',
            text: 'Menampilkan ' + result.data.length + ' data siswa.',
            timer: 1500,
            showConfirmButton: false
          });
        } else {
          Swal.fire({
            icon: 'info',
            title: 'Tidak Ada Data',
            text: 'Tidak ada tagihan siswa yang ditemukan untuk kelas ' + kelas,
            confirmButtonColor: '#64748b'
          });
        }
      } else {
        Swal.fire({
          icon: 'error',
          title: 'Gagal Memuat Data',
          text: result.message || 'Terjadi kesalahan saat memuat data.',
          confirmButtonColor: '#dc2626'
        });
      }
    })
    .withFailureHandler(function(err) {
      Swal.close();
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'Terjadi kesalahan: ' + err.message,
        confirmButtonColor: '#dc2626'

// ============================================================
// SETTING TAGIHAN - FILTER SISWA BERDASARKAN JENIS KELAMIN
// ============================================================

// Variabel untuk menyimpan data siswa asli
var allSiswaData = [];
var filteredSiswaData = [];

/**
 * Fungsi untuk memfilter siswa berdasarkan jenis kelamin
 */
function filterSiswaByJenisKelaminJS() {
  var filterValue = document.getElementById('setting-filter-jk').value;
  var container = document.getElementById('setting-siswa-container');
  
  // Jika belum ada data siswa, tampilkan pesan
  if (!allSiswaData || allSiswaData.length === 0) {
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center h-64 text-slate-400">
        <i class="fa-solid fa-users text-4xl mb-3"></i>
        <p class="text-sm">Pilih kelas terlebih dahulu</p>
      </div>
    `;
    return;
  }
  
  // Filter data berdasarkan jenis kelamin
  if (filterValue === 'ALL') {
    filteredSiswaData = allSiswaData.slice();
  } else {
    filteredSiswaData = allSiswaData.filter(function(siswa) {
      var jk = normalizeJenisKelamin(siswa.jenis_kelamin);
      return jk === filterValue;
    });
  }
  
  // Render ulang daftar siswa dengan data yang sudah difilter
  renderSiswaList(filteredSiswaData);
  
  // Update counter
  updateSiswaCount();
}

/**
 * Normalisasi jenis kelamin
 * @param {string} value - Nilai jenis kelamin dari database
 * @returns {string} - 'LAKI-LAKI' atau 'PEREMPUAN'
 */
function normalizeJenisKelamin(value) {
  if (!value) return 'LAKI-LAKI'; // Default jika kosong
  
  var text = String(value).toUpperCase().trim();
  
  // Cek apakah laki-laki
  if (text === 'LAKI-LAKI' || text === 'LAKI LAKI' || text === 'L' || text === 'Laki-laki' || text === 'laki-laki') {
    return 'LAKI-LAKI';
  }
  
  // Cek apakah perempuan
  if (text === 'PEREMPUAN' || text === 'P' || text === 'Perempuan' || text === 'perempuan') {
    return 'PEREMPUAN';
  }
  
  // Default jika tidak terdeteksi
  return 'LAKI-LAKI';
}

/**
 * Render daftar siswa
 * @param {array} siswaList - Daftar siswa yang akan ditampilkan
 */
function renderSiswaList(siswaList) {
  var container = document.getElementById('setting-siswa-container');
  
  if (!siswaList || siswaList.length === 0) {
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center h-64 text-slate-400">
        <i class="fa-solid fa-user-slash text-4xl mb-3"></i>
        <p class="text-sm">Tidak ada siswa yang sesuai dengan filter</p>
      </div>
    `;
    return;
  }
  
  var html = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 max-h-[400px] overflow-y-auto pr-2">
  `;
  
  siswaList.forEach(function(siswa) {
    // Tentukan icon berdasarkan jenis kelamin
    var jk = normalizeJenisKelamin(siswa.jenis_kelamin);
    var iconClass = jk === 'LAKI-LAKI' ? 'fa-mars text-blue-500' : 'fa-venus text-pink-500';
    var labelJk = jk === 'LAKI-LAKI' ? 'L' : 'P';
    
    // Cek apakah siswa sudah dipilih (untuk mempertahankan state checkbox)
    var isChecked = siswa.checked ? 'checked' : '';
    
    html += `
      <label class="flex items-start gap-2 p-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
        <input
          type="checkbox"
          class="siswa-checkbox mt-0.5 w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
          value="${siswa.id_siswa}"
          data-nama="${siswa.nama_lengkap}"
          data-kelas="${siswa.kelas}"
          data-jk="${siswa.jenis_kelamin}"
          onchange="updateSiswaCount()"
          ${isChecked}
        />
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium text-slate-700 truncate">
            ${siswa.nama_lengkap}
          </div>
          <div class="flex items-center gap-2 text-xs text-slate-500">
            <span>${siswa.nisn || '-'}</span>
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-slate-100">
              <i class="fa-solid ${iconClass} text-xs"></i>
              ${labelJk}
            </span>
          </div>
        </div>
      </label>
    `;
  });
  
  html += '</div>';
  container.innerHTML = html;
}

/**
 * Update jumlah siswa yang dipilih
 */
function updateSiswaCount() {
  var checkboxes = document.querySelectorAll('.siswa-checkbox:checked');
  var count = checkboxes.length;
  var total = document.querySelectorAll('.siswa-checkbox').length;
  
  var countElement = document.getElementById('setting-siswa-count');
  if (countElement) {
    countElement.textContent = count + ' dipilih';
  }
  
  // Enable/disable button generate
  var btnGenerate = document.getElementById('btn-generate-tagihan');
  if (btnGenerate) {
    btnGenerate.disabled = count === 0;
  }
  
  // Update check-all state
  var checkAll = document.getElementById('setting-check-all');
  if (checkAll) {
    if (count === 0) {
      checkAll.checked = false;
      checkAll.indeterminate = false;
    } else if (count === total && total > 0) {
      checkAll.checked = true;
      checkAll.indeterminate = false;
    } else {
      checkAll.checked = false;
      checkAll.indeterminate = true;
    }
  }
}

/**
 * Toggle check all siswa
 */
function toggleCheckAllSiswaJS() {
  var checkAll = document.getElementById('setting-check-all');
  var checkboxes = document.querySelectorAll('.siswa-checkbox');
  
  checkboxes.forEach(function(checkbox) {
    checkbox.checked = checkAll.checked;
  });
  
  updateSiswaCount();
}

/**
 * Load siswa berdasarkan kelas
 */
function loadSiswaByKelasJS() {
  var kelas = document.getElementById('setting-kelas').value;
  var container = document.getElementById('setting-siswa-container');
  
  // Reset checkbox "Pilih Semua" setiap kali load kelas baru
  var checkAll = document.getElementById('setting-check-all');
  if (checkAll) {
    checkAll.checked = false;
    checkAll.indeterminate = false;
  }
  
  if (!kelas) {
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center h-64 text-slate-400">
        <i class="fa-solid fa-users text-4xl mb-3"></i>
        <p class="text-sm">Pilih kelas terlebih dahulu</p>
      </div>
    `;
    allSiswaData = [];
    filteredSiswaData = [];
    document.getElementById('setting-siswa-count').textContent = '0 dipilih';
    
    // Disable generate button
    var btnGenerate = document.getElementById('btn-generate-tagihan');
    if (btnGenerate) btnGenerate.disabled = true;
    return;
  }
  
  // Tampilkan loading
  container.innerHTML = `
    <div class="flex flex-col items-center justify-center h-64 text-slate-400">
      <i class="fa-solid fa-circle-notch animate-spin text-3xl mb-3 text-emerald-600"></i>
      <p class="text-sm">Memuat data siswa...</p>
    </div>
  `;
  
  google.script.run
    .withSuccessHandler(function(siswaList) {
      // Simpan data asli
      allSiswaData = siswaList.map(function(s) {
        return {
          id_siswa: s.id_siswa || '',
          nisn: s.nisn || '',
          nis: s.nis || '',
          nama_lengkap: s.nama_lengkap || '',
          jenis_kelamin: s.jenis_kelamin || '',
          kelas: s.kelas || '',
          tahun_pelajaran: s.tahun_pelajaran || '',
          id_potongan_default: s.id_potongan_default || '',
          checked: false
        };
      });
      
      // Reset filter ke ALL
      var filterSelect = document.getElementById('setting-filter-jk');
      if (filterSelect) filterSelect.value = 'ALL';
      
      // Terapkan filter (ALL)
      filteredSiswaData = allSiswaData.slice();
      renderSiswaList(filteredSiswaData);
      updateSiswaCount();
      
      // Reset checkbox "Pilih Semua"
      var checkAll = document.getElementById('setting-check-all');
      if (checkAll) {
        checkAll.checked = false;
        checkAll.indeterminate = false;
      }
    })
    .withFailureHandler(function(err) {
      container.innerHTML = `
        <div class="flex flex-col items-center justify-center h-64 text-red-500">
          <i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i>
          <p class="text-sm">Gagal memuat data: ${err.message}</p>
        </div>
      `;
      
      Swal.fire({
        icon: 'error',
        title: 'Gagal Memuat Data',
        text: 'Gagal memuat data siswa: ' + err.message,
        confirmButtonColor: '#dc2626'
      });
    })
    .getSiswaByKelas(kelas);
}

/**
 * Generate tagihan massal
 */
function generateTagihanMassalJS() {
  var kelas = document.getElementById('setting-kelas').value;
  var idPos = document.getElementById('setting-pos').value;
  var periode = document.getElementById('setting-periode').value;
  var nominal = document.getElementById('setting-nominal').value;
  var idPotongan = document.getElementById('setting-potongan').value;
  var bisaDicicil = document.getElementById('setting-bisa-dicicil').checked;
  var catatan = document.getElementById('setting-catatan').value;
  
  // Validasi
  if (!kelas) {
    Swal.fire({
      icon: 'warning',
      title: 'Peringatan',
      text: 'Silakan pilih kelas terlebih dahulu.',
      confirmButtonColor: '#f59e0b'
    });
    return;
  }
  
  if (!idPos) {
    Swal.fire({
      icon: 'warning',
      title: 'Peringatan',
      text: 'Silakan pilih pos pembayaran.',
      confirmButtonColor: '#f59e0b'
    });
    return;
  }
  
  if (!periode) {
    Swal.fire({
      icon: 'warning',
      title: 'Peringatan',
      text: 'Silakan isi periode tagihan.',
      confirmButtonColor: '#f59e0b'
    });
    return;
  }
  
  // Ambil siswa yang dipilih
  var checkboxes = document.querySelectorAll('.siswa-checkbox:checked');
  if (checkboxes.length === 0) {
    Swal.fire({
      icon: 'warning',
      title: 'Peringatan',
      text: 'Silakan pilih minimal satu siswa.',
      confirmButtonColor: '#f59e0b'
    });
    return;
  }
  
  var idSiswaList = [];
  checkboxes.forEach(function(cb) {
    idSiswaList.push(cb.value);
  });
  
  // Konfirmasi
  var totalSiswa = idSiswaList.length;
  var posName = document.getElementById('setting-pos').options[document.getElementById('setting-pos').selectedIndex]?.text || idPos;
  
  Swal.fire({
    title: 'Konfirmasi Generate Tagihan',
    html: `
      <div style="text-align: left; padding: 10px 0;">
        <p><strong>Jumlah Siswa:</strong> ${totalSiswa} siswa</p>
        <p><strong>Pos Pembayaran:</strong> ${posName}</p>
        <p><strong>Periode:</strong> ${periode}</p>
        <p><strong>Nominal:</strong> ${nominal ? 'Rp ' + Number(nominal).toLocaleString('id-ID') : 'Default (dari master)'}</p>
        <p><strong>Potongan:</strong> ${idPotongan ? 'Ya' : 'Default Siswa'}</p>
        <p><strong>Bisa Dicicil:</strong> ${bisaDicicil ? 'Ya' : 'Tidak'}</p>
        ${catatan ? '<p><strong>Catatan:</strong> ' + catatan + '</p>' : ''}
      </div>
    `,
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#10b981',
    cancelButtonColor: '#64748b',
    confirmButtonText: 'Ya, Generate!',
    cancelButtonText: 'Batal'
  }).then(function(result) {
    if (result.isConfirmed) {
      // Tampilkan progress
      showLoading('Mengenerate tagihan...');
      
      var payload = {
        id_pos: idPos,
        periode: periode,
        nominal: parseFloat(nominal) || 0,
        id_potongan: idPotongan || '',
        bisa_dicicil: bisaDicicil,
        catatan: catatan || '',
        id_siswa_list: idSiswaList
      };
      
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          
          if (result.success) {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil!',
              text: result.message,
              confirmButtonColor: '#10b981'
            }).then(function() {
              // Refresh data siswa
              loadSiswaByKelasJS();
              
              // Reset checkbox
              var checkAll = document.getElementById('setting-check-all');
              if (checkAll) {
                checkAll.checked = false;
                checkAll.indeterminate = false;
              }
              
              // Refresh riwayat
              setTimeout(function() {
                var isKelasActive = !document.getElementById('riwayat-tab-kelas').classList.contains('hidden');
                if (isKelasActive) {
                  searchRiwayatKelas(riwayatKelasPage || 1);
                } else {
                  searchRiwayatKelas(1);
                }
                
                window._needRefreshKelas = true;
                window._needRefreshSiswa = true;
              }, 1000);
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Gagal Generate',
              text: result.message,
              confirmButtonColor: '#dc2626'
            });
          }
        })
        .withFailureHandler(function(err) {
          hideLoading();
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Terjadi kesalahan: ' + err.message,
            confirmButtonColor: '#dc2626'
          });
        })
        .generateTagihanMassal(payload);
    }
  });
}

/**
 * Reset filter siswa
 */
function resetFilterSiswaJS() {
  document.getElementById('setting-filter-jk').value = 'ALL';
  filterSiswaByJenisKelaminJS();
}
