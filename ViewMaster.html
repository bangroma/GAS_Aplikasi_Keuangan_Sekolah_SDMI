<div id="view-master" class="tab-content hidden space-y-6">
  <div class="flex flex-col md:flex-row justify-between md:items-center gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Master Data</h2>
      <p class="text-sm text-slate-500">Kelola data master sistem keuangan.</p>
    </div>
  </div>

  <!-- TABS MASTER -->
  <div
    class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"
  >
    <div class="flex border-b overflow-x-auto">
      <button
        onclick="switchMasterTab('Master_Pos')"
        id="master-tab-Master_Pos"
        class="master-tab px-5 py-3.5 text-sm font-semibold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50 whitespace-nowrap"
      >
        <i class="fa-solid fa-list-ul mr-2"></i>
        Master Pos
      </button>
      <button
        onclick="switchMasterTab('Master_Potongan')"
        id="master-tab-Master_Potongan"
        class="master-tab px-5 py-3.5 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-50 whitespace-nowrap"
      >
        <i class="fa-solid fa-percent mr-2"></i>
        Master Potongan
      </button>
      <button
        onclick="switchMasterTab('Pos_Pembayaran')"
        id="master-tab-Pos_Pembayaran"
        class="master-tab px-5 py-3.5 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-50 whitespace-nowrap"
      >
        <i class="fa-solid fa-file-invoice-dollar mr-2"></i>
        Pos Pembayaran
      </button>
    </div>

    <!-- TOOLBAR -->
    <div
      class="px-5 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50 border-b"
    >
      <div class="text-sm text-slate-600">
        <span id="master-sheet-label" class="font-bold text-slate-800"
          >Master Pos</span
        >
        <span id="master-total-data" class="ml-2 text-slate-500">• 0 data</span>
      </div>
      <div class="flex gap-2">
        <button
          onclick="loadMasterDataJS()"
          class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-sm transition"
        >
          <i class="fa-solid fa-rotate mr-1"></i>
          Refresh
        </button>
        <button
          onclick="openMasterFormJS()"
          class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-sm transition"
        >
          <i class="fa-solid fa-plus mr-1"></i>
          Tambah Data
        </button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="bg-white border-b text-slate-600 font-semibold">
          <tr id="master-table-head">
            <th class="p-4">Memuat...</th>
          </tr>
        </thead>
        <tbody id="master-table-body" class="divide-y text-slate-700">
          <tr>
            <td class="p-10 text-center text-slate-400">
              <i
                class="fa-solid fa-circle-notch animate-spin text-2xl mb-2 text-emerald-600"
              ></i>
              <p class="text-sm">Memuat data...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL FORM MASTER -->
<div
  id="modal-master-form"
  class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto"
>
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 space-y-5">
    <div class="flex justify-between items-start border-b pb-4">
      <div>
        <h3 id="master-form-title" class="text-xl font-bold text-slate-800">
          Tambah Data
        </h3>
        <p id="master-form-subtitle" class="text-xs text-slate-500 mt-1">
          Master Pos
        </p>
      </div>
      <button
        onclick="closeMasterFormJS()"
        class="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form
      id="master-form"
      onsubmit="return false;"
      class="space-y-4 max-h-[60vh] overflow-y-auto pr-1"
    >
      <!-- field akan di-generate otomatis -->
    </form>

    <div class="flex gap-2 pt-2 border-t">
      <button
        onclick="saveMasterFormJS()"
        id="btn-save-master"
        class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition"
      >
        <i class="fa-solid fa-floppy-disk mr-1"></i>
        Simpan
      </button>
      <button
        onclick="closeMasterFormJS()"
        class="px-5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-sm"
      >
        Batal
      </button>
    </div>
  </div>
</div>
