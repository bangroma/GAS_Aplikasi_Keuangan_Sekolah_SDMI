<style>
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  @media print {
    body * {
      visibility: hidden !important;
    }
    #printable-receipt,
    #printable-receipt * {
      visibility: visible !important;
    }
    #printable-receipt {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 78mm !important;
      padding: 2mm !important;
      margin: 0 !important;
      border: none !important;
      box-shadow: none !important;
      font-size: 10pt !important;
      color: #000 !important;
    }
    @page {
      size: 80mm auto;
      margin: 0;
    }
  }
</style>
