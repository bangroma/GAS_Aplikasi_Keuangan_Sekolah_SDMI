<div id="view-dashboard" class="tab-content hidden space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-800">Dashboard Keuangan</h2>
    <p class="text-sm text-slate-500">Ringkasan sistem keuangan sekolah.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <span class="text-xs text-slate-500 font-bold uppercase">
        Status Sistem
      </span>
      <div
        class="text-xl font-bold text-emerald-600 mt-1 flex items-center gap-2"
      >
        <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
        Ready / Online
      </div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <span class="text-xs text-slate-500 font-bold uppercase">
        Modul Pembayaran
      </span>
      <div class="text-xl font-bold text-indigo-600 mt-1">Aktif</div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <span class="text-xs text-slate-500 font-bold uppercase">
        Riwayat Transaksi
      </span>
      <div class="text-xl font-bold text-amber-600 mt-1">Aktif</div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <span class="text-xs text-slate-500 font-bold uppercase">
        Laporan Tunggakan
      </span>
      <div class="text-xl font-bold text-rose-600 mt-1">Aktif</div>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 p-8 text-center">
    <i class="fa-solid fa-chart-pie text-5xl text-emerald-500 mb-4"></i>
    <h3 class="text-lg font-bold text-slate-700">
      Dashboard sedang dikembangkan
    </h3>
    <p class="text-sm text-slate-500 mt-1">
      Statistik penerimaan, tunggakan, dan grafik keuangan akan ditempatkan di
      sini.
    </p>
  </div>
</div>
